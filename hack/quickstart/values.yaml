# TinyCDI chart values for the kind quickstart (DEV ONLY - docs/quickstart.md).
#
# up.sh layers a generated file on top of this one (image references and, when
# TCDI_QS_DOMAIN is set, the hostnames). Every Secret named below is created
# by up.sh before the install; nothing sensitive lives in this file.

managedNamespaces:
  - name: tinycdi-tenant-a
    tenant: tenant-a

# *.tcdi.localtest.me resolves to 127.0.0.1 on the public DNS, including
# ws-<hex>.session.tcdi.localtest.me. portalHost sits outside sessionDomain.
portalHost: portal.tcdi.localtest.me
sessionDomain: session.tcdi.localtest.me

oidc:
  # Dev Keycloak realm created by up.sh inside the cluster. Pods reach this
  # name through a CoreDNS rewrite to the ingress controller.
  issuer: https://keycloak.tcdi.localtest.me/realms/tinycdi
  clientID: tinycdi
  existingSecret: tinycdi-oidc-client
  egressCIDRs: [0.0.0.0/0]
  # kindnet enforces NetworkPolicy after the ingress Service is NAT-ed, so the
  # egress rule must name Traefik's container port, not the Service port 443.
  port: 8443

database:
  existingSecret: tinycdi-backend-db
  allowedPeers:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: tcdi-qs-deps}
      podSelector:
        matchLabels: {app.kubernetes.io/name: postgres}
  # Postgres serves a certificate from the quickstart CA; the backend still
  # verifies it (verify-full), exactly like production.
  tls:
    mode: verify-full
    caSecret: {name: tinycdi-db-ca, key: ca.crt}

backend:
  replicas: 2
  loginKeys:
    generate: true
  tls:
    app: {existingSecret: tinycdi-backend-app-tls}
    session: {existingSecret: tinycdi-backend-session-tls}
    internal: {existingSecret: tinycdi-backend-internal-tls}
  clientCA: {existingSecret: tinycdi-internal-ca}
  # Trust bundle for the OIDC issuer (the quickstart CA).
  extraCA: {existingSecret: tinycdi-local-ca, key: ca.crt}
  # The backend listeners speak HTTPS: tell Traefik to re-encrypt to them.
  service:
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: https

operator:
  brokerClient:
    ca: {existingSecret: tinycdi-internal-ca}
    mtls: {existingSecret: tinycdi-operator-mtls}

frontend:
  tls: {existingSecret: tinycdi-frontend-tls}
  service:
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: https

ingress:
  enabled: true
  className: traefik
  tls: {existingSecret: tinycdi-ingress-tls}

# kind has no dedicated workspace pool: runtime pods share the node. Keep the
# dedicated pool in production (docs/runbooks/install.md "Workspace node pool").
runtime:
  placement:
    allowSharedNodes: true
  # kind nodes have no AppArmor: the kubelet refuses a pod that names an
  # AppArmor profile there, so do not pin RuntimeDefault (supported setting
  # for nodes without AppArmor; keep the default true on nodes that have it).
  appArmor:
    requireRuntimeDefault: false
  # kind nodes cannot start user-namespaced pods (runc fails mounting sysfs),
  # so the quickstart leaves pod.spec.hostUsers unset. Keep the v0.2 default
  # (false) on a real cluster.
  hostUsers: null

templates:
  - name: browser
    namespace: tinycdi-tenant-a
    image: browser
    annotations:
      workspaces.cdi.tinyorbit.vn/display-name: "Browser (quickstart)"
    spec:
      revision: "quickstart-1"
      runtime: LinuxContainer
      experience: Browser
      linux:
        # Firefox ESR instead of Chromium: Chromium's sandbox needs the
        # Localhost seccomp/AppArmor node profiles, which a kind node cannot
        # load. Firefox runs with seccomp-bpf only (reduced isolation, see
        # docs/images.md) - fine for a throwaway quickstart, never for
        # production. TCDI_BROWSER is read by the image's xstartup.
        command: [env, TCDI_BROWSER=firefox, /opt/tcdi/entrypoint.sh]
      resources: {cpu: "1", memory: 2Gi, storage: 5Gi}
      bootDeadline: 10m
      networkProfile: Isolated
      clipboardPolicy: Disabled
      lifecycle:
        idleTimeout: 30m
        disconnectTimeout: 5m
        maxDuration: 8h
        dataPolicy: Ephemeral
  - name: desktop
    namespace: tinycdi-tenant-a
    image: linuxDesktop
    annotations:
      workspaces.cdi.tinyorbit.vn/display-name: "Linux desktop (quickstart)"
    spec:
      revision: "quickstart-1"
      runtime: LinuxContainer
      experience: Desktop
      linux: {}
      resources: {cpu: "1", memory: 2Gi, storage: 5Gi}
      bootDeadline: 10m
      networkProfile: Isolated
      clipboardPolicy: Disabled
      lifecycle:
        idleTimeout: 30m
        disconnectTimeout: 5m
        maxDuration: 8h
        dataPolicy: Ephemeral
