        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/admin/tenants/{tenant}/user-limits/default:
    get:
      operationId: getAdminUserLimitDefault
      summary: The tenant's default user limit
      description: |
        The tenant-wide fallback running-workspace limit applied to every
        principal without an override (`limit: null` = unlimited). The
        `ETag` header carries the default row's strong entity tag; it is
        absent while no default is set. Requires the tenant-admin role on
        the named tenant.
      tags: [admin]
