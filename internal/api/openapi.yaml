          description: |
            An actor reference `oidc:<hex>`/`anonymous`, or an
            `issuer|sub` owner reference, which is pseudonymized
            server-side.
          schema:
            type: string
            maxLength: 512
        - name: target
          in: query
          required: false
          description: Exact target identifier (for example a workspace ID).
          schema:
            type: string
            maxLength: 256
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on `createdAt`.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Exclusive upper bound on `createdAt`.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: One page of audit events for the named tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

