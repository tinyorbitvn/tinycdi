openapi: 3.1.0
info:
  title: tinycdi Workspace Platform — Public API
  version: "1.0.0"
  summary: |
    Public HTTP API of the tinycdi workspace platform (portal origin).
  description: |
    This API is the only interface end users and the portal talk to. It is served
    on the **portal origin**; interactive desktop traffic runs on a separate
    **session origin** reached only through the launch flow described under
    `POST /v1/workspaces/{workspaceId}/connections`.

    ## Multi-tenancy and authorization

    - Authentication is an OIDC-backed session cookie. The verified principal
      (issuer + subject + tenant) is the sole source of ownership: requests never
      carry an owner field and the server never trusts client-supplied identity.
    - Every resource is scoped to the caller's tenant. Regular users see only
      resources they own; tenant administrators see the tenant scope.
      Cross-tenant access returns `404 NOT_FOUND` (the resource is not
      distinguishable from non-existent), never a leak of existence.
    - Authorization to act on a workspace (view, start, stop, delete, connect,
      attach, purge) requires ownership or tenant-admin role; otherwise
      `403 FORBIDDEN` / `404 NOT_FOUND`.
    - End users never write Kubernetes custom resources. The API translates
      accepted intents into `Workspace` CRs through its own service account via a
      transactional outbox (see ADR 0002); Kubernetes RBAC denies direct CR
      writes by end users.

    ## Session idle timeout

    Sessions carry a sliding idle timeout (default 30 min) inside a fixed
    absolute cap. The server decides what counts as activity — never the
    client: **every `GET` endpoint on this API is passive** and
    authenticates without extending the idle deadline, so the portal's
    interval polls cannot hold a visible-but-unattended session open.
    Sliding happens only through mutations — including the explicit
    user-interaction beat `POST /v1/session:touch` — and server-measured
    interactive desktop input. A session that has idled out is dead
    everywhere: lease redeem, renew and rehydrate consult the same window,
    so an open desktop stream dies with the session it was launched under
    within one renew cycle.

    ## Idempotency

    Mutating operations that allocate resources (`POST /v1/workspaces`,
    `POST /v1/workspaces/{id}:start`, `POST /v1/data/{id}:attach`) require an
    `Idempotency-Key` header. Retrying with the same key and an identical
    request body returns the originally recorded result; the same key with a
    different body returns `409 IDEMPOTENCY_CONFLICT`. Keys are scoped to the
    authenticated principal and expire after 24 hours.

    ## Errors

    Every `4xx`/`5xx` response has the `Error` body
    `{"error": {code, message, retryable, requestId, details?}}`. `code` is a stable enum value
    clients may switch on; `message` is human-readable and not part of the
    contract; `retryable` tells whether retrying the same request may succeed
    without further user action; `requestId` correlates with server logs/audit.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: tinycdi platform team

servers:
  - url: "https://{portalHost}"
    description: Portal origin (API + UI). Desktop traffic uses a separate session origin.
    variables:
      portalHost:
        default: portal.example.invalid
        description: Registrable domain serving the portal and this API.

security:
  - sessionCookie: []

tags:
  - name: workspaces
    description: Workspace lifecycle — catalog-driven desktops owned by the caller.
  - name: templates
    description: Workspace template catalog published by administrators.
  - name: data
    description: Retained data disks — inventory, attach and purge.
  - name: admin
    description: Tenant administration — quota and usage views.
  - name: session
    description: Session bootstrap — identity, CSRF token and session domain.

paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Session bootstrap payload
      description: |
        Returns the verified identity of the caller, its roles, the CSRF token
        to echo in the `X-CSRF-Token` header on every mutating request, and the
        session domain under which per-workspace session hosts live
        (`ws-<suffix>.<sessionDomain>`). The CSRF token is derived from the
        session ID server-side and is never stored; it is only valid for the
        session that fetched it.
      tags: [session]
      responses:
        "200":
          description: Identity bootstrap for the portal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/session:
    get:
      operationId: getSessionProbe
      summary: Passive signed-in probe
      description: |
        Reports whether the request carries a live portal session. Needs no
        authentication: a signed-out caller gets `200` with
        `{"authenticated": false}` rather than `401`, so the portal can check
        before calling `GET /v1/me` without a failed request showing up in the
        browser console. The probe is passive — it never slides the idle
        timer, sets no cookie and needs no CSRF token — and discloses nothing
        but the boolean (no subject, tenant, roles or token). The response is
        `Cache-Control: no-store`.
      tags: [session]
      security: []
      responses:
        "200":
          description: Whether a live session accompanied the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProbe"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/session:touch:
    post:
      operationId: touchSession
      summary: Activity beat
      description: |
        The explicit "the user is here" signal (FIX-IDLE). The session is
        authenticated passively, the CSRF token checked, and only then does
        the handler slide the idle deadline explicitly — a cookie-only
        request that fails the token check can never extend the window.
        The handler answers `204` with no body. It exists because every
        `GET` on this API is passive: the portal calls it only on real
        user interaction (pointer, key, navigation), never from a
        timer-driven poll, and throttles to at most one call per minute.

        Requires the session cookie and the `X-CSRF-Token` header (`401`
        without a session, `403` without a valid token) — forging a touch
        is therefore exactly as hard as forging any mutation. The call is
        rate-limited like the rest of the login/session family, keyed on
        the session digest when the cookie is valid.

        A session that already idled out cannot be revived by a touch:
        authentication fails `401` before the write, same as any route.
      tags: [session]
      responses:
        "204":
          description: Idle deadline extended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/logout:
    post:
      operationId: logout
      summary: Sign out
      description: |
        Ends the caller's portal session: the server-side session is deleted
        and the session cookie is expired. Requires the session cookie and the
        `X-CSRF-Token` header (`401` without a session, `403` without a valid
        token).

        When the identity provider advertises an `end_session_endpoint` in its
        discovery document and the deployment has `oidc.endSession` on
        (default), the answer is `200` with the URL that ends the provider
        session too; the portal navigates the browser there. Without that the
        provider session would survive and the next visit would sign the user
        straight back in. The URL is assembled only from the provider's
        discovery document and the deployment configuration — `client_id`
        always, `post_logout_redirect_uri` only when the deployment sets
        `oidc.postLogoutRedirect` — never from the request (no open redirect).
        The session keeps no ID token, so `id_token_hint` is not sent.
        Otherwise the answer is `204` and the portal stays local.

        The server-side session delete is the point of no return: when the
        session store cannot delete it, the answer is `503` `UNAVAILABLE`
        with `Retry-After` — the cookie is NOT expired and no session-bound
        leases or launch tickets are revoked, so the caller is still fully
        signed in and may simply retry. A success status is only ever sent
        after the session row is gone.
      tags: [session]
      responses:
        "200":
          description: Portal session ended; continue at the identity provider.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "204":
          description: Portal session ended; nothing more to do.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/me/sessions:revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Sign out everywhere
      description: |
        Ends **every** portal session the caller's principal holds **in the
        caller's current tenant** — the calling session included, with no
        keep-self opt-out — and revokes, in the same store transaction, the
        session-layer material minted under them: every active connection
        lease (streams on any gateway replica close within one renew cycle
        and a replayed workspace-host cookie resolves to a revoked lease,
        `401`) and every still-outstanding launch ticket. Sessions and
        material under **other tenants are not touched**. Requires the
        session cookie and the `X-CSRF-Token` header (`401` without a
        session, `403` without a valid token).

        Like `POST /v1/logout`, the answer is `200` with
        `{"endSessionUrl"}` when the identity provider advertises an
        `end_session_endpoint` and the deployment has `oidc.endSession` on;
        the portal navigates the browser there. The URL is assembled only
        from discovery and configuration — never from the request.

        The revocation is atomic: a store failure rolls the whole
        transaction back, so nothing is destroyed, the caller stays signed
        in, and the answer is `500` — retrying is safe (the operation is
        idempotent).
      tags: [session]
      responses:
        "200":
          description: All portal sessions ended; continue at the identity provider.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "204":
          description: All portal sessions ended; nothing more to do.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces visible to the caller
      description: |
        Returns workspaces owned by the caller; tenant administrators see all
        workspaces in their tenant. Keyset-paged on `(sort field, id)`:
        `sort` accepts `createdAt` and `name` (`-` prefix for descending) and
        defaults to `-createdAt` (newest first). A page never repeats or skips
        a row when workspaces are created concurrently.
      tags: [workspaces]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/ListScope"
        - name: phase
          in: query
          description: Filter by lifecycle phase.
          required: false
          schema:
            $ref: "#/components/schemas/WorkspacePhase"
      responses:
        "200":
          description: Page of workspaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspacePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Accepts a create intent and returns the workspace record. The caller
        becomes the owner; there is intentionally **no owner field** in the
        request — ownership is derived from the verified principal.

        Creation reserves quota and records the intent in a single transaction;
        the runtime is provisioned asynchronously. `desiredState` defaults to
        `Stopped`; pass `Running` to provision immediately.

        `retainedDataRef` optionally attaches a retained disk owned by the
        caller (equivalent to `POST /v1/data/{id}:attach`); the retained record
        must be in state `Retained` and is claimed exclusively.

        A template whose runtime image is older than `-image-block-after`
        (default 45 d) is refused with `409 IMAGE_STALE` (E3); a template
        without a parseable `imageBuiltAt` never blocks.

        Idempotent: same `Idempotency-Key` + same body returns the recorded
        workspace; same key + different body returns `409 IDEMPOTENCY_CONFLICT`.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created (or replayed idempotent result).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get a workspace
      description: Returns the caller-visible view of one workspace.
      tags: [workspaces]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: |
        Requests deletion. The workspace moves to `Terminating`: access is
        revoked, leases are drained, the runtime is stopped, retained-data
        handling runs, then the record is removed. Deletion is asynchronous and
        idempotent — repeating the call while `Terminating` returns the current
        view, not an error.

        For `dataPolicy: Retain` the disk is moved to the retained inventory
        (`/v1/data`); for `Ephemeral` it is destroyed.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "202":
          description: Deletion accepted; workspace is terminating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}:start:
    post:
      operationId: startWorkspace
      summary: Start a workspace
      description: |
        Sets `desiredState: Running` and provisions the runtime
        asynchronously. Requires phase `Stopped` or `Failed` (retry after
        failure); any other phase returns `409 INVALID_STATE`. Repeating start
        with the same `Idempotency-Key` returns the recorded result; a new key
        while already `Running`/`Ready` is a no-op returning the current view.

        When the workspace's template family has a newer published revision
        (`updateAvailable`), a start under `imageUpdate: OnStart` moves to it
        (E1/E2). A start that cannot move to a fresher revision and whose
        resolved image is older than `-image-block-after` is refused with
        `409 IMAGE_STALE` (E3); `imageUpdate: Pinned` workspaces on a stale
        image are refused the same way.

        A `Failed` workspace that is wanted `Running` is recovered by `:start`
        when its failure reason is recoverable (`BootDeadlineExceeded`,
        `FailedCleanup`, `RuntimeLost`): the platform mints a new runtime
        generation, revokes the failed generation's leases and launch tickets,
        and rebuilds the runtime on the same home volume. Repeating the call
        before the new generation is observed does not mint another one.
        A workspace that failed with `ImagePolicyDenied`, `HomeVolumeLost` or
        `TemplateRejected` is refused with `409 INVALID_STATE` and
        `details.reason` set to that reason; stop and start it again after
        the cause is fixed, or delete it.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      responses:
        "202":
          description: Start accepted; workspace view after the intent was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}:stop:
    post:
      operationId: stopWorkspace
      summary: Stop a workspace
      description: |
        Sets `desiredState: Stopped`. Open connections are revoked and the
        runtime is shut down; persistent data follows `dataPolicy`. Stop is
        idempotent: stopping a `Stopped`/`Stopping` workspace returns the
        current view.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "202":
          description: Stop accepted; workspace view after the intent was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}/events:
    get:
      operationId: listWorkspaceEvents
      summary: Curated workspace lifecycle events
      description: |
        Returns the workspace's events, newest first: the API's own recorded
        lifecycle steps (create/start/stop/delete intents) and curated
        condition transitions. Messages are fixed catalog strings — raw
        Kubernetes or operator error text is never forwarded, so event text
        never contains node names, image references or other platform
        internals. Visibility is exactly the workspace read's: a foreign or
        unknown id is a `404`.

        Keyset-paged on `(lastTimestamp, id)`. The order is fixed: `sort`
        accepts only `-time` (the default); anything else is
        `400 INVALID_REQUEST`.
      tags: [workspaces]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Workspace events, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}/connections:
    post:
      operationId: createConnection
      summary: Issue a launch ticket for an interactive session
      description: |
        Issues a short-lived (60 s), single-use opaque **launch ticket** and a
        `launchUrl` on the workspace's own session host
        (`https://ws-<suffix>.<sessionDomain>/v1/launch`). The browser opens the session by
        POSTing the ticket to `launchUrl` (form POST on the session host); the
        gateway redeems it atomically through the broker and sets a host-only
        `Secure`/`HttpOnly`/`SameSite` session cookie, then redirects to a clean
        URL. The ticket never travels in a query string and is never logged; the
        server stores only its hash.

        Requirements: the workspace must be in phase `Ready` with
        `desiredState: Running`, otherwise `409 INVALID_STATE`. A workspace ID
        that cannot map to a session host also answers `409 INVALID_STATE`.
        At most one
        interactive connection is authorized per workspace: if a live lease
        exists and `takeover` is not set, the call fails with
        `409 CONNECTION_IN_USE`. With `takeover: true` the previous session is
        revoked and fenced **before** the new ticket becomes usable.

        On the session origin itself, every proxied request — the
        `/websockify` stream and plain asset fetches alike — draws on a
        per-workspace, per-replica bound of concurrent upstream
        connections (`-session-stream-cap`, default 32; the KasmVNC
        runtime cannot survive a reconnect storm above its fd-derived
        crash boundary). A request over the bound answers
        `429` + `Retry-After: 1` with the session-listener error body
        `{"error": "too_many_streams"}` — retryable, and the KasmVNC
        client's in-frame reconnect absorbs it. Session-origin errors use
        that lowercase `error`-field shape, distinct from this API's
        `code`/`retryable` envelope.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Launch ticket issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/workspaces/{workspaceId}/file-transfers:
    post:
      operationId: createFileTransfer
      summary: Mint a single-use file-transfer grant for a running workspace
      description: |
        Resolves the file-transfer policy in force now (template policy met
        against the tenant ceiling and the platform bound), checks the
        direction and, for an upload, the declared size, and records a
        single-use grant bound to the workspace's current runtime
        incarnation and to the caller. The browser then moves the bytes with
        a credentialed request to `contentUrl` on the workspace's session
        origin within 2 minutes; the gateway claims the grant (policy is
        checked again) and streams the body. Only the workspace owner may
        mint; a tenant administrator gets `404` on another user's workspace.
        The workspace must be `Ready`, otherwise `409 INVALID_STATE`. A policy
        that refuses the direction answers `403 FORBIDDEN` with
        `details.reason: transfer_denied`.
      tags: [workspaces]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFileTransferRequest"
      responses:
        "201":
          description: Grant minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
