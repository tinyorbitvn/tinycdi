  /v1/admin/tenants/{tenant}/sessions:
    get:
      operationId: listAdminSessions
      summary: Live desktop sessions of a tenant (paged)
      description: |
        Administrator list of the tenant's live connection leases (state
        `active` and not past `expiresAt`), read from the shared PostgreSQL
        session directory, so every backend replica answers the same.
        `ownerRef` narrows the list to one principal. Items never carry the
        lease id: `leaseRef` is a stable, non-secret reference. Sort:
        `-createdAt` only (newest first; anything else is `INVALID_REQUEST`).
        Requires the tenant-admin role on the named tenant.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - name: ownerRef
          in: query
          required: false
          description: Only this principal's sessions (`issuer|sub`).
          schema:
            type: string
            minLength: 3
            maxLength: 512
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: One page of live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLiveSessionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/admin/tenants/{tenant}/users/{ownerRef}/sessions:revoke-all:
    post:
      operationId: revokeAdminUserSessions
      summary: Sign a user out everywhere
      description: |
        The administrator variant of `POST /v1/me/sessions:revoke-all`: in
        one store transaction it ends every portal session the named
        principal holds in the named tenant and revokes their active
        connection leases and outstanding launch tickets. The administrator's
        own session is untouched (unless they name themselves). Workspaces
        keep running. Requires the tenant-admin role on the named tenant and
        the `X-CSRF-Token` header; audited as `admin.session.revoke`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/OwnerRef"
      responses:
        "200":
          description: What the revocation destroyed (all zero when the principal had nothing).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRevokeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/admin/tenants/{tenant}/overview:
    get:
      operationId: getAdminOverview
      summary: Tenant health overview
      description: |
        Live desktop sessions (active, unexpired connection leases), Ready
        workspaces per template, the provisioning p95 over the last 24 hours
        (request to Ready, from the boot ledger), the Workspaces stuck
        deleting, and the phase counts. One aggregate query plus the
        operator's status counts; the answer is cached for 15 seconds per
        tenant. `fresh: false` means the Kubernetes watch is stale and the
        Kubernetes-derived counts are empty. Counts only, no identities.
        Requires the tenant-admin role on the named tenant.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Tenant"
      responses:
        "200":
          description: The tenant overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/data:
    get:
      operationId: listRetainedData
      summary: List retained data disks visible to the caller
      description: |
        Returns retained-disk records owned by the caller (tenant
        administrators see the tenant scope). Each record carries a fresh
        `purgeConfirmationNonce` required by `POST /v1/data/{dataId}:purge`.
        Keyset-paged on `(sort field, id)`: `sort` accepts `retainedAt` and
        `name` (the source workspace name; `-` prefix for descending) and
        defaults to `-retainedAt` (newest first).
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/ListScope"
      responses:
        "200":
          description: Page of retained data records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetainedDataPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/data/{dataId}:
    get:
      operationId: getRetainedData
      summary: Get one retained data disk
      description: |
        Returns the record as `GET /v1/data` lists it, including a fresh
        `purgeConfirmationNonce`. Visible to the owner recorded on the record
        and to tenant administrators of the same tenant; any other caller —
        and any other tenant — gets `404 NOT_FOUND`.
      tags: [data]
      parameters:
        - $ref: "#/components/parameters/DataId"
      responses:
        "200":
          description: The retained data record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetainedDataView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/data/{dataId}:attach:
    post:
      operationId: attachRetainedData
      summary: Attach a retained disk to a new workspace
      description: |
        Creates a **new workspace** whose disk is the retained record. The
        record must be in state `Retained` and is claimed exclusively: the
        transition `Retained → Attaching → Attached` is a conditional update in
        the same transaction as the quota reservation and outbox intent, so
        attach and purge mutually exclude each other and a disk has at most one
        consumer at a time. If the new workspace is deleted before the attach
        completes, the disk returns to `Retained`; it is never garbage-collected
        with the old workspace.

        The resulting workspace is a new runtime identity: new
        `runtimeGeneration` and enrollment token, and the old workspace's
        credentials are invalidated on first boot via re-enrollment.

        Only the owner recorded on the retained record (or a tenant admin) may
        attach. Idempotent via `Idempotency-Key`.
      tags: [data]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DataId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachDataRequest"
      responses:
        "201":
          description: Workspace created from the retained disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/data/{dataId}:purge:
    post:
      operationId: purgeRetainedData
      summary: Irreversibly destroy a retained disk
      description: |
        Schedules destruction of a retained disk. Requires the
        `confirmationNonce` from the caller's latest read of the record
        (`GET /v1/data`) — the nonce is short-lived, single-use and bound to the
        record, principal and record state, so replaying an old nonce fails with
        `400 INVALID_REQUEST`.

        Only records in state `Retained` can be purged: `Attaching`/`Attached`
        disks return `409 INVALID_STATE` (detach/delete the consuming workspace
        first), and a concurrent attach wins or loses the race atomically —
        never both. Purge is asynchronous; the record reports `Purging` until
        the disk is actually deleted, and storage quota stays reserved until
        then.
      tags: [data]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/DataId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeDataRequest"
      responses:
        "202":
          description: Purge accepted; record is now `Purging`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetainedDataView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tcdi_session
      description: |
        OIDC-backed session cookie issued by the portal login flow
        (`Secure`, `HttpOnly`, `SameSite=Strict` on the portal origin).
        Required on every endpoint.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token obtained from `GET /v1/me` and echoed on
        every mutating request. Combined with `SameSite=Strict` cookies this
        blocks cross-site request forgery; a missing or mismatched token
        returns `403 CSRF_FAILED`. Required on all non-GET operations.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Server-generated workspace identifier.
      schema:
        type: string
        pattern: "^ws_[A-Za-z0-9]{8,64}$"
        example: ws_01J4Z8KQ2M9XNBV3T7YH0R6D5E
    DataId:
      name: dataId
      in: path
      required: true
      description: Server-generated retained-data record identifier.
      schema:
        type: string
        pattern: "^rd_[A-Za-z0-9]{8,64}$"
        example: rd_01J4Z9W2PFK8G4TQ3M7H1R5N0A
    Tenant:
      name: tenant
      in: path
      required: true
      description: |
        Tenant identifier. Callers may only administer their own tenant —
        the tenant-admin role is tenant-scoped, so a `tenant` value that
        differs from the caller's tenant answers `403 FORBIDDEN`.
      schema:
        type: string
        example: acme
    OwnerRef:
      name: ownerRef
      in: path
      required: true
      description: |
        The principal's `issuer|sub` owner reference, as the user-limits
        list reports it — percent-encoded in the path (`|` → `%7C`, `/` in
        the issuer → `%2F`).
      schema:
        type: string
        minLength: 3
        maxLength: 512
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (recommended: UUIDv4/ULID). Same key + same
        request body replays the recorded result; same key + different body
        returns `409 IDEMPOTENCY_CONFLICT`. Scoped to the principal; retained
        for 24 h.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        example: "9f3b2c44-3d7a-4b1e-9c2d-1f8a0b6c5d4e"
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional dedup key honored the same way as on create; the operation is
        naturally idempotent without it.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum items per page (default 50, max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset cursor from a previous response's `nextCursor`. A cursor
        minted under a different `sort` is rejected as `INVALID_REQUEST`.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Allowlisted sort field; a `-` prefix means descending (for example
        `-createdAt`). The accepted fields and the default are documented per
        operation; anything else is `INVALID_REQUEST`.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Strong entity tag of the resource's current version, as returned in
        the `ETag` header or body of the last read/write. Missing → `428
        PRECONDITION_REQUIRED`; stale or malformed → `412
        PRECONDITION_FAILED`. `*` is accepted only when the resource does not
        exist yet (create-or-replace semantics).
      schema:
        type: string
    ListScope:
      name: scope
      in: query
      required: false
      description: |
        `mine` restricts the list to the caller's own rows (also for tenant
        administrators); `tenant` widens it to the whole tenant and requires
        the `tenant-admin` role — `403 FORBIDDEN` otherwise. Omitted keeps the
        caller's natural scope (admins see the tenant, users their own rows).
      schema:
        type: string
        enum: [mine, tenant]

  headers:
    ETag:
      description: |
        Strong entity tag of the returned resource's current version — a
        quoted string clients echo verbatim in `If-Match` on the next
        mutation.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request is malformed or violates the contract — `INVALID_REQUEST`
        (bad JSON, unknown field, missing confirmation nonce, invalid cursor).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, expired or invalid session — `UNAUTHENTICATED`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Authenticated but not allowed — `FORBIDDEN` for authorization failures,
        `CSRF_FAILED` for a missing/mismatched CSRF token on a mutation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        Resource does not exist or is not visible to the caller's tenant —
        `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        State or idempotency conflict — `IDEMPOTENCY_CONFLICT` (key reused with
        a different body), `INVALID_STATE` (operation not valid in the current
        phase/record state), `CONNECTION_IN_USE` (a live interactive lease
        exists and `takeover` was not set), `QUOTA_EXHAUSTED` (tenant/user
        quota has no headroom), `QUOTA_NOT_CONFIGURED` (the tenant has no
        quota at all, so creates fail closed), or `QUOTA_MANAGED_BY_CONFIG`
        (the tenant's quota is owned by `-tenant-quotas` and only the
        platform configuration may change it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: |
        Semantically invalid reference — `INVALID_TEMPLATE` (templateRef is
        unknown, unpublished, not permitted for this tenant, or incompatible
        with the retained disk's runtime).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: |
        Missing precondition — `PRECONDITION_REQUIRED`: the mutation requires
        an `If-Match` header carrying the resource's current `ETag` (or `*`
        when the resource does not exist yet).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: |
        Optimistic-concurrency failure — `PRECONDITION_FAILED`: the
        `If-Match` value does not name the current state of the resource
        (a concurrent write landed first), or `*` was sent for a resource
        that already exists. Reload and retry with the fresh version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded — `RATE_LIMITED`. Honor `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error — `INTERNAL`. Safe to retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: |
        Transient dependency failure — `UNAVAILABLE` (store/broker
        unreachable). Safe to retry with backoff.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. Values and their `retryable`
        semantics:

        | code | HTTP | retryable | meaning |
        |---|---|---|---|
        | `UNAUTHENTICATED` | 401 | false | no/expired session; re-login |
        | `CSRF_FAILED` | 403 | false | missing/mismatched CSRF token; refresh session bootstrap |
        | `FORBIDDEN` | 403 | false | principal lacks permission on this resource |
        | `NOT_FOUND` | 404 | false | resource absent or outside caller's tenant |
        | `INVALID_REQUEST` | 400 | false | malformed body/params; fix the request |
        | `INVALID_TEMPLATE` | 422 | false | templateRef unknown, unpublished or disallowed |
        | `INVALID_STATE` | 409 | true | phase/record state forbids the op now; retry once it settles to a compatible state |
        | `IDEMPOTENCY_CONFLICT` | 409 | false | Idempotency-Key reused with a different body; generate a new key |
        | `QUOTA_EXHAUSTED` | 409 | false | tenant/user quota has no headroom; free resources or raise quota. A refusal by a per-principal running limit carries `details.reason: UserLimitReached` with `details.params.limit`/`details.params.current`. Exception: when the shortfall is only quota a deleted or stopped workspace still holds pending teardown, the same code is returned with `retryable: true`, `details.reason: release_pending` and a `Retry-After` header — the release lands on the next recovery pass and the request may be retried. A `UserLimitReached` refusal can likewise carry `retryable: true` + `Retry-After` when the caller's own teardown-pending holds cover the shortfall |
        | `QUOTA_NOT_CONFIGURED` | 409 | false | no quota is configured for the tenant, so creates fail closed; an administrator must set one |
        | `QUOTA_MANAGED_BY_CONFIG` | 409 | false | the tenant's quota is declared in `-tenant-quotas` and can only change through the platform configuration, not the admin quota API |
        | `PRECONDITION_REQUIRED` | 428 | false | the mutation requires an `If-Match` header; send the resource's current `ETag` (or `*` when the resource does not exist yet) |
        | `PRECONDITION_FAILED` | 412 | false | If-Match named a stale version, or `*` on an existing resource; reload the resource and retry |
        | `CONNECTION_IN_USE` | 409 | false | a live interactive lease exists; pass `takeover: true` to replace it |
        | `IMAGE_STALE` | 409 | false | the resolved runtime image is older than `-image-block-after` (default 45 d); the message names the template, and for a pinned workspace says it can start again only after an administrator publishes a fresh image. `details` carries `templateName`, `ageDays`, `limitDays`, `pinned` |
        | `RATE_LIMITED` | 429 | true | transient throttle; honor `Retry-After` |
        | `UNAVAILABLE` | 503 | true | transient dependency failure (store/broker); retry with backoff |
        | `INTERNAL` | 500 | true | unexpected server failure; safe to retry |

        Clients must treat unknown codes as `INTERNAL` (retryable: true).
      enum:
        - UNAUTHENTICATED
        - CSRF_FAILED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_REQUEST
        - INVALID_TEMPLATE
        - INVALID_STATE
        - IDEMPOTENCY_CONFLICT
        - QUOTA_EXHAUSTED
        - QUOTA_NOT_CONFIGURED
        - QUOTA_MANAGED_BY_CONFIG
        - PRECONDITION_REQUIRED
        - PRECONDITION_FAILED
        - CONNECTION_IN_USE
        - IMAGE_STALE
        - RATE_LIMITED
        - UNAVAILABLE
        - INTERNAL

    Error:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        Uniform error envelope returned for every 4xx/5xx response — the body
        is the single key `error` carrying an `ErrorBody`.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, retryable, requestId]
      description: Uniform error object inside the `error` envelope.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable detail; not part of the contract.
          example: "workspace ws_01J4Z8KQ2M9XNBV3T7YH0R6D5E is not in a startable phase"
        retryable:
          type: boolean
          description: |
            Whether retrying the same request may succeed without user action
            (see the `ErrorCode` table for per-code semantics).
        requestId:
          type: string
          description: Server-generated request ID for support/log correlation.
          example: req_01J4ZA1X0YJ8H6K0Q3MW1N5B2P
        details:
          type: object
          additionalProperties: false
          description: |
            Optional machine-readable context alongside `code`; absent on
            most errors.
          properties:
            reason:
              type: string
              description: |
                Finer-grained cause within `code`. `release_pending` on
                `QUOTA_EXHAUSTED` means the refused amount is held only by
                workspaces whose quota release is already pending teardown
                — the response then also carries `retryable: true` and a
                `Retry-After` header. `UserLimitReached` on
                `QUOTA_EXHAUSTED` means the refusal came from a
                per-principal running-workspace limit, not the tenant
                quota; `params` carries `limit` and `current`, and the
                response may also carry `retryable: true` + `Retry-After`
                when the caller's own teardown-pending holds cover the
                shortfall. On `:start` of a Failed workspace: the
                unrecoverable failure reason (`ImagePolicyDenied`,
                `HomeVolumeLost`, `TemplateRejected`). `transfer_denied`
                on `FORBIDDEN` means the policy in force refuses the
                requested file-transfer direction.
              enum: [release_pending, UserLimitReached, ImagePolicyDenied, HomeVolumeLost, TemplateRejected, transfer_denied]
            templateName:
              type: string
              description: |
                `IMAGE_STALE` only: the template whose runtime image is
                over `-image-block-after` — the message names it too.
            ageDays:
              type: integer
              description: "`IMAGE_STALE` only: observed image age in whole days."
            limitDays:
              type: integer
              description: "`IMAGE_STALE` only: configured freshness limit in whole days."
            pinned:
              type: boolean
              description: |
                `IMAGE_STALE` only: true when the workspace is pinned to the
                stale revision (`imageUpdate: Pinned` or a guard-refused
                move) — it can start again only after an administrator
                publishes a fresh image.
            params:
              type: object
              additionalProperties:
                type: string
              description: |
                Flat string map of values a reason's message interpolates
                (the same convention as `WorkspaceEvent.params`).
                `UserLimitReached` sets `limit` (the principal's maximum
                concurrent running workspaces) and `current` (the running
                workspaces the principal already holds).

    WorkspacePhase:
      type: string
      description: |
        Lifecycle phase — a summary; `conditions` carry the operational detail.
        `Ready` requires the runtime to be actually connectable (display +
        streaming endpoint checked), not merely scheduled.
      enum: [Pending, Provisioning, Ready, Stopping, Stopped, Failed, Terminating]

    DesiredState:
      type: string
      description: User intent for the runtime.
      enum: [Running, Stopped]

    DataPolicy:
      type: string
      description: |
        `Ephemeral` destroys disk data on stop/delete; `Retain` keeps the
        persistent volume across stop and moves it to the retained inventory on
        delete.
      enum: [Ephemeral, Retain]

    RuntimeKind:
      type: string
      enum: [LinuxContainer, WindowsVM]

    ExperienceKind:
      type: string
      enum: [Desktop, Browser]

    ConditionType:
      type: string
      enum: [Admitted, StorageReady, RuntimeReady, ConnectionReady, Degraded, IntentBehind]

    ConditionStatus:
      type: string
      enum: ["True", "False", "Unknown"]

    WorkspaceCondition:
      type: object
      additionalProperties: false
      required: [type, status, reason, lastTransitionTime]
      description: |
        Summary of a Kubernetes-style condition projected for UI use. `reason`
        is a machine-readable CamelCase string; `message` is optional detail.
      properties:
        type:
          $ref: "#/components/schemas/ConditionType"
        status:
          $ref: "#/components/schemas/ConditionStatus"
        reason:
          type: string
          example: BootDeadlineExceeded
        message:
          type: string
          description: Optional human-readable detail; not part of the contract.
        params:
          $ref: "#/components/schemas/ReasonParams"
        lastTransitionTime:
          type: string
          format: date-time

    ReasonParams:
      type: object
      additionalProperties:
        type: string
      description: |
        Structured parameters of a `reason`'s message, as a flat string map —
        the same values the server interpolated into `message` (or used to
        select it), so a client can localize the full text instead of
        parsing English. Keys are lowerCamelCase tokens; the set a given
        reason carries is documented in docs/lifecycle-reasons.md. Never
        carries secrets, tokens or internal hostnames. Absent when the
        message interpolates nothing.

    TemplateSummary:
      type: object
      additionalProperties: false
      required: [id, name, family, revision, runtime, experience]
      description: Immutable template+revision the workspace was created from.
      properties:
        id:
          type: string
          pattern: "^tpl_[A-Za-z0-9][A-Za-z0-9-]{6,62}[A-Za-z0-9]$"
          example: tpl_01J4ZB3N1RXD7P2V8W5K0H6Q4M
        name:
          type: string
          example: linux-firefox-desktop
        family:
          type: string
          description: |
            Catalog name shared by every revision of one template; revisions
            of a family are grouped under it in the catalog.
          example: linux-firefox-desktop
        revision:
          type: integer
          description: Immutable template revision number.
          example: 7
        runtime:
          $ref: "#/components/schemas/RuntimeKind"
        experience:
          $ref: "#/components/schemas/ExperienceKind"

    Owner:
      type: object
      additionalProperties: false
      required: [subject, displayName]
      description: |
        Public identity of a resource owner. `subject` is the bare OIDC `sub`;
        `displayName` is the name the principal directory last saw at login,
        falling back to `subject`. Display data only — never an authorization
        input.
      properties:
        subject:
          type: string
        displayName:
          type: string

    WorkspaceView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - owner
        - template
        - phase
        - conditions
        - desiredState
        - dataPolicy
        - createdAt
        - updatedAt
        - templateRevision
        - updateAvailable
      description: |
        Public view of a workspace. It deliberately omits control-plane
        internals: no runtime credentials (never serialized), no Kubernetes
        names/UIDs, and no `runtimeGeneration`/`runtimeUID` fencing values —
        the UI only needs `phase` + `conditions` to decide connectability.
      properties:
        id:
          type: string
          pattern: "^ws_[A-Za-z0-9]{8,64}$"
          example: ws_01J4Z8KQ2M9XNBV3T7YH0R6D5E
        name:
          type: string
          description: Caller-assigned display name; unique per owner.
          example: research-desktop
        owner:
          $ref: "#/components/schemas/Owner"
        template:
          $ref: "#/components/schemas/TemplateSummary"
        phase:
          $ref: "#/components/schemas/WorkspacePhase"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceCondition"
          description: Current condition summary (may be empty while Pending).
        desiredState:
          $ref: "#/components/schemas/DesiredState"
        dataPolicy:
          $ref: "#/components/schemas/DataPolicy"
        retainedDataRef:
          type: string
          pattern: "^rd_[A-Za-z0-9]{8,64}$"
          description: Present when the workspace consumes a retained disk.
        failureReason:
          type: string
          description: Short machine-readable cause when `phase` is `Failed`.
          example: BootDeadlineExceeded
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        imageBuiltAt:
          type: string
          format: date-time
          description: |
            Build timestamp of the runtime image, resolved through the
            workspace's template (its
            workspaces.cdi.tinyorbit.vn/image-built-at annotation). Absent
            when the template is gone or carries no parseable annotation.
        imageStale:
          type: boolean
          description: |
            True when the runtime image is older than the backend's
            -image-stale-after threshold (default 336h). Advisory; a
            create or start on an image older than -image-block-after
            (default 45 d) is refused with 409 IMAGE_STALE (E3).
        templateRevision:
          type: string
          description: |
            Verbatim revision identifier (`spec.revision`) of the template
            revision the workspace is on. Refreshed when a start moves the
            workspace to a newer revision of its template family.
          example: "2026-10-b"
        updateAvailable:
          type: boolean
          description: |
            True when the workspace's template family published a newer
            revision a Stopped -> Running start would move to: the recorded
            revision is not the newest, its imageUpdate policy is not
            Pinned, and the newest revision is runtime/experience/data-
            policy/storage compatible.

    WorkspaceEvent:
      type: object
      additionalProperties: false
      required: [id, type, reason, message]
      description: |
        One curated workspace event. `message` is a fixed catalog string —
        raw Kubernetes or operator error text is never forwarded.
      properties:
        id:
          type: string
          description: |
            Stable identifier, unique within the list and identical across
            reads: condition type + reason for observed conditions
            (`Degraded.BootDeadlineExceeded`), reason + intent revision for
            lifecycle steps (`StartRequested.4`), `Failed.<reason>` for the
            synthesized failure event. Usable as a list key.
          example: StartRequested.4
        type:
          type: string
          enum: [Normal, Warning]
        reason:
          type: string
          description: Short machine-readable reason token.
          example: StartRequested
        message:
          type: string
          description: Human-readable, curated event text.
          example: Starting the workspace was requested.
        params:
          $ref: "#/components/schemas/ReasonParams"
        count:
          type: integer
          minimum: 1
        firstTimestamp:
          type: string
          format: date-time
        lastTimestamp:
          type: string
          format: date-time

    WorkspaceEventPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEvent"
          description: Events, newest first.
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
        stale:
          type: boolean
          description: |
            True when the observed-state informer cannot prove freshness.
            Condition events then show last-known state and never claim the
            workspace is ready. Absent (false) otherwise.

    QuotaAmounts:
      type: object
      additionalProperties: false
      required:
        [workspaces, runningWorkspaces, cpuMillicores, memoryMib, storageGib]
      description: Resource vector in display units.
      properties:
        workspaces:
          type: integer
          description: |
            Active (not deleted) workspace count. Within `limits`, 0 means
            there is no count limit (quota is enforced on running slots, CPU,
            memory and storage).
        runningWorkspaces:
          type: integer
          description: Reserved running slots.
        cpuMillicores:
          type: integer
          description: CPU in millicores.
        memoryMib:
          type: integer
          description: Memory in MiB.
        storageGib:
          type: integer
          description: Storage in GiB.

    QuotaView:
      type: object
      additionalProperties: false
      required: [tenant, configured, usage]
      description: |
        Tenant quota snapshot. `configured` is false when the tenant has no
        quota row: new workspaces are then refused, so the absence of
        `limits` must never be read as "unlimited". `limits` is absent in that
        state. `userLimits` is present only when the caller has an
        effective per-principal running-workspace limit; inside it only
        `runningWorkspaces` is meaningful (the other dimensions stay zero —
        per-user limits cover the running count only).
      properties:
        tenant:
          type: string
        configured:
          type: boolean
          description: |
            False when the tenant has no quota row. Admission then refuses
            every create, so clients must show "no quota configured", never
            "no limit".
        limits:
          $ref: "#/components/schemas/QuotaAmounts"
        usage:
          $ref: "#/components/schemas/QuotaAmounts"
        userLimits:
          $ref: "#/components/schemas/QuotaAmounts"

    QuotaSource:
      type: string
      enum: [config, api, none]
      description: |
        Which layer owns the tenant's limits row. `config`: the tenant is
        declared in `-tenant-quotas` and its row is upserted from the
        platform configuration — writes through the API are refused with
        `QUOTA_MANAGED_BY_CONFIG`. `api`: a row exists that no config
        declaration claims, so it stays writable through the admin quota
        API. `none`: no row exists at all — admission fails closed, so the
        absence of `limits` must never read as "unlimited".

    AdminQuotaLimits:
      type: object
      additionalProperties: false
      required: [runningWorkspaces, cpuMillicores, memoryMib, storageGib]
      description: |
        Quota limits in display units — the enforced dimensions of
        `QuotaAmounts`. Every field is required; a partial block would
        silently mean "none allowed" for the missing dimension. A value of
        0 admits nothing on that dimension, and limits below current usage
        are accepted (held reservations stay, new ones are refused). There
        is no workspace-count limit, so `workspaces` is not settable.
      properties:
        runningWorkspaces:
          type: integer
          minimum: 0
          description: Maximum reserved running slots.
        cpuMillicores:
          type: integer
          minimum: 0
          description: Maximum CPU in millicores.
        memoryMib:
          type: integer
          minimum: 0
          description: Maximum memory in MiB.
        storageGib:
          type: integer
          minimum: 0
          description: Maximum storage in GiB.

    AdminQuotaView:
      type: object
      additionalProperties: false
      required: [tenant, configured, source, usage]
      description: |
        Administrator quota snapshot for one tenant: `QuotaView` plus
        `source`, which names the layer owning the limits row. `limits` is
        absent when the tenant has no quota row (`configured: false`,
        `source: none` — or `config` while a declared row is still pending
        the startup upsert). The row's version travels as the `ETag`
        response header.
      properties:
        tenant:
          type: string
        configured:
          type: boolean
          description: |
            False when the tenant has no quota row. Admission then refuses
            every create, so clients must show "no quota configured", never
            "no limit".
        source:
          $ref: "#/components/schemas/QuotaSource"
        limits:
          $ref: "#/components/schemas/QuotaAmounts"
        usage:
          $ref: "#/components/schemas/QuotaAmounts"

    AdminUserLimitPage:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        One page of per-principal running-workspace limits, ordered by
        `ownerRef`. Limits cap concurrent running workspaces — a workspace
        counts while its reservation holds a running slot (from the
        start/create intent until the runtime is proven gone); stopped
        Retain workspaces' disk-only holds and retained disks never count.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserLimitEntry"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    AdminUserLimitEntry:
      type: object
      additionalProperties: false
      required: [ownerRef, subject, displayName, limit, effective, running]
      description: One principal's per-user limit row.
      properties:
        ownerRef:
          type: string
          description: |
            The `issuer|sub` owner reference admission enforces on — the
            `{ownerRef}` of the item's `PUT`/`DELETE` path.
        subject:
          type: string
          description: Bare OIDC subject of the user.
        displayName:
          type: string
          description: Name from the principal directory; falls back to `subject`.
        limit:
          type: ["integer", "null"]
          description: Stored override; `null` = inherits the tenant default.
        effective:
          type: ["integer", "null"]
          description: Resolved limit (override, else default); `null` = unlimited.
        running:
          type: integer
          description: Running workspaces the principal currently holds.
        etag:
          type: string
          description: |
            Strong entity tag of the principal's override row, sent as
            `If-Match` on `PUT`/`DELETE`. Absent while the principal has no
            override — `PUT` then creates it with `If-Match: *`.

    SetUserLimitRequest:
      type: object
      additionalProperties: false
      required: [limit]
      description: |
        Write one principal's running-workspace override. An override is
        removed with `DELETE`, so `limit` is required.
      properties:
        limit:
          type: integer
          minimum: 0
          description: Maximum concurrent running workspaces.

    SetUserLimitDefaultRequest:
      type: object
      additionalProperties: false
      description: |
        Write the tenant-wide fallback running-workspace limit. `limit`
        sets it; `null` (or absent) clears it back to unlimited.
      properties:
        limit:
          type: ["integer", "null"]
          minimum: 0
          description: Maximum concurrent running workspaces per principal; `null` clears the default.

    AdminUserLimitDefault:
      type: object
      additionalProperties: false
      required: [tenant, limit]
      description: |
        The tenant-wide fallback running-workspace limit applied to every
        principal without an override. Its version travels as the `ETag`
        response header.
      properties:
        tenant:
          type: string
        limit:
          type: ["integer", "null"]
          description: Tenant-wide fallback limit; `null` = unlimited.

    ClipboardCeiling:
      type: string
      enum: [FollowTemplate, Disabled, Send, Receive, Bidirectional]
      description: |
        A tenant's clipboard ceiling over every workspace template's
        `clipboardPolicy` — direction names are from the user's point of
        view (`Send` = device → workspace, `Receive` = workspace →
        device). `FollowTemplate` narrows nothing: the template's own
        policy applies. The effective clipboard policy is the meet of the
        template's and this ceiling — `Send ∩ Receive = Disabled`, and a
        ceiling never widens past the template (ADR 0009 §1).

    FileTransferCeiling:
      type: object
      additionalProperties: false
      required: [mode, maxFileBytes]
      description: |
        The tenant's file-transfer ceiling over the template's
        `fileTransferPolicy`: `mode` narrows the direction,
        `maxFileBytes` lowers the per-file size bound.
      properties:
        mode:
          type: string
          enum: [FollowTemplate, Disabled, Upload, Download, Bidirectional]
          description: |
            Ceiling over the template's file-transfer policy (`Upload` =
            device → workspace home, `Download` = workspace → device).
        maxFileBytes:
          type: ["integer", "null"]
          minimum: 1
          description: |
            Per-file size bound, 1 up to the platform bound; `null` = the
            platform bound.

    AdminSessionPolicySource:
      type: string
      enum: [TenantRow, FollowTemplate]
      description: |
        Whether a session-policy row exists for the tenant. `TenantRow`:
        a row was written through this API. `FollowTemplate`: no row —
        every channel follows the template.

    AdminSessionPolicyView:
      type: object
      additionalProperties: false
      required: [tenant, clipboard, fileTransfer, source]
      description: |
        The tenant's session data-transfer ceiling (ADR 0009): one value
        per channel, `FollowTemplate` where the channel is not narrowed.
        The effective policy a user gets is the meet of the template's
        policy and this ceiling — it can only narrow, never widen. The
        row's version travels as the `ETag` response header.
      properties:
        tenant:
          type: string
        clipboard:
          $ref: "#/components/schemas/ClipboardCeiling"
        fileTransfer:
          $ref: "#/components/schemas/FileTransferCeiling"
        source:
          $ref: "#/components/schemas/AdminSessionPolicySource"

    PutAdminSessionPolicy:
      type: object
      additionalProperties: false
      required: [clipboard]
      description: |
        Write the tenant's session data-transfer ceiling. `clipboard` is
        required. Setting every channel to `FollowTemplate` deletes the
        row.
      properties:
        clipboard:
          $ref: "#/components/schemas/ClipboardCeiling"
        fileTransfer:
          $ref: "#/components/schemas/FileTransferCeiling"

    ApplySessionPolicyRequest:
      type: object
      additionalProperties: false
      required: [dryRun]
      properties:
        dryRun: {type: boolean, description: "true lists the affected workspaces without restarting them."}
        includeActive: {type: boolean, default: false, description: "Also restart workspaces with a live desktop session."}
    ApplySessionPolicyResult:
      type: object
      additionalProperties: false
      required: [dryRun, truncated, affected]
      properties:
        dryRun: {type: boolean}
        truncated: {type: boolean, description: "More workspaces are affected (or running) than one call handles; only the first 500 affected are listed. Call again after they restart."}
        affected:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [workspaceId, name, owner, applied, effective, live, result]
            properties:
              workspaceId: {type: string}
              name: {type: string}
              owner: {$ref: '#/components/schemas/Owner'}
              applied: {$ref: '#/components/schemas/ResolvedSessionPolicy'}
              effective: {$ref: '#/components/schemas/ResolvedSessionPolicy'}
              live: {type: boolean}
              result: {type: string, enum: [pending, restarted, skipped_active, skipped_moved, failed]}

    AdminAuditEntry:
      type: object
      additionalProperties: false
      required: [id, createdAt, actor, action, targetKind, targetId, outcome, requestId, details]
      properties:
        id: {type: string}
        createdAt: {type: string, format: date-time}
        actor: {type: string, description: "Pseudonymous actor reference (oidc:<16 hex>) or anonymous."}
        action: {type: string}
        targetKind: {type: string, enum: ["", workspace, data, tenant, session], description: "What targetId identifies; derived from the action namespace (auditTargetKind)."}
        targetId: {type: string}
        outcome: {type: string, enum: [success, denied, failure]}
        errorCode: {type: string}
        requestId: {type: string}
        details: {type: object, additionalProperties: {type: string}}
    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminAuditEntry'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    AdminTenantUser:
      type: object
      additionalProperties: false
      required: [ownerRef, subject, displayName, email, lastSeenAt, workspaces, limits]
      properties:
        ownerRef: {type: string}
        subject: {type: string}
        displayName: {type: string}
        email: {type: string}
        lastSeenAt: {type: string, format: date-time}
        workspaces: {type: integer, format: int64, minimum: 0}
        limits: {$ref: '#/components/schemas/AdminUserLimitEntry'}
    AdminTenantUserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminTenantUser'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}

    AdminLiveSession:
      type: object
      additionalProperties: false
      required: [leaseRef, workspaceId, workspaceName, ownerRef, owner, createdAt, expiresAt]
      properties:
        leaseRef: {type: string, pattern: '^[0-9a-f]{16}$', description: "Stable non-secret reference (SHA-256 prefix of the lease id)."}
        workspaceId: {type: string}
        workspaceName: {type: string}
        ownerRef: {type: string}
        owner: {$ref: '#/components/schemas/Owner'}
        createdAt: {type: string, format: date-time}
        lastRenewedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    AdminLiveSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminLiveSession'}}
        nextCursor: {$ref: '#/components/schemas/NextCursor'}
    AdminRevokeResult:
      type: object
      additionalProperties: false
      required: [sessions, tickets, leases]
      properties:
        sessions: {type: integer, minimum: 0}
        tickets: {type: integer, minimum: 0}
        leases: {type: integer, minimum: 0}
    AdminOverview:
      type: object
      additionalProperties: false
      required: [liveSessions, runningByTemplate, phases, provisioning, stuckFinalizers, fresh, generatedAt]
      properties:
        liveSessions: {type: integer, format: int64, minimum: 0}
        runningByTemplate:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [template, count]
            properties:
              template: {type: string}
              count: {type: integer, minimum: 0}
        phases: {type: object, additionalProperties: {type: integer, minimum: 0}}
        provisioning:
          type: object
          additionalProperties: false
          required: [samples]
          properties:
            p95Seconds: {type: number, minimum: 0, description: "Absent when no workspace became Ready in the last 24 hours."}
            samples: {type: integer, format: int64, minimum: 0}
        stuckFinalizers: {type: integer, minimum: 0}
        fresh: {type: boolean, description: "False when the Kubernetes watch is stale; Kubernetes counts are then empty."}
        generatedAt: {type: string, format: date-time}

    ResolvedSessionPolicy:
      type: object
      additionalProperties: false
      required: [clipboard, fileTransfer]
      description: |
        The resolved (effective) session data-transfer policy for a
        (tenant, template) pair — the meet of the template's own policy
        and the tenant ceiling, recorded on the launch ticket at issue
        (ADR 0009 §2). The portal renders the session iframe's `allow`
        from this record, not from a template it may have read earlier.
      properties:
        clipboard:
          type: string
          enum: [Disabled, Send, Receive, Bidirectional]
          description: The resolved clipboard policy.
        fileTransfer:
          type: string
          enum: [Disabled, Upload, Download, Bidirectional]
          description: |
            The resolved file-transfer direction policy: the meet of the
            template's `fileTransferPolicy` and the tenant ceiling — the
            same enum WorkspaceSpec.sessionPolicy.fileTransfer carries.
        maxFileBytes:
          type: integer
          format: int64
          minimum: 0
          description: "Per-file bound in bytes; 0 when fileTransfer is Disabled."

    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, templateRef]
      description: |
        Create intent. There is no owner field — ownership comes from the
        verified principal. `templateRef`, `dataPolicy` and `retainedDataRef`
        are immutable after creation (change requires a replacement workspace).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9-]{0,126}[a-z0-9]$|^[a-z0-9]$"
          description: DNS-label-style display name, unique per owner.
          example: research-desktop
        templateRef:
          type: string
          pattern: "^tpl_[A-Za-z0-9][A-Za-z0-9-]{6,62}[A-Za-z0-9]$"
          description: Template to instantiate (always the latest published revision unless the ID itself is revision-pinned by the catalog).
          example: tpl_01J4ZB3N1RXD7P2V8W5K0H6Q4M
        desiredState:
          $ref: "#/components/schemas/DesiredState"
          description: Defaults to `Stopped`; `Running` provisions immediately.
        dataPolicy:
          $ref: "#/components/schemas/DataPolicy"
          description: Defaults to the template's lifecycle default.
        retainedDataRef:
          type: string
          pattern: "^rd_[A-Za-z0-9]{8,64}$"
          description: |
            Retained disk to attach to the new workspace. The record must be
            `Retained` and owned by the caller; mutually exclusive claims are
            enforced server-side.

    NextCursor:
      type: string
      description: |
        Opaque cursor for the next page (pass it as `cursor` with the same
        `sort`); absent on the last page.

    WorkspacePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceView"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    SessionProbe:
      type: object
      additionalProperties: false
      required: [authenticated]
      description: |
        Answer of `GET /v1/session`: exactly one key. Never carries identity,
        tenant, roles or a token.
      properties:
        authenticated:
          type: boolean
          description: True when the request carries a live (not idle- or absolute-expired) session.

    LogoutResult:
      type: object
      additionalProperties: false
      required: [endSessionUrl]
      description: |
        Answer of `POST /v1/logout` when the identity provider session can be
        ended too.
      properties:
        endSessionUrl:
          type: string
          format: uri
          description: |
            The provider's end-session endpoint with `client_id` (and
            `post_logout_redirect_uri` when configured). Navigate the browser
            here.

    Me:
      type: object
      additionalProperties: false
      required: [subject, displayName, tenant, roles, csrfToken, sessionDomain]
      description: |
        Session bootstrap payload returned by `GET /v1/me`: the verified
        identity, the caller's roles, the CSRF token to echo on mutations, and
        the session domain under which per-workspace session hosts live.
      properties:
        subject:
          type: string
          description: Subject claim of the verified identity.
        displayName:
          type: string
          description: |
            Display name captured from the verified ID token at login
            (`name`, else `preferred_username`) and served from the principal
            directory; falls back to `subject` when unknown.
        email:
          type: string
          description: Email claim when the identity provider supplies one.
        tenant:
          type: string
          description: Tenant the principal belongs to.
        roles:
          type: array
          items:
            type: string
            enum: [user, tenant-admin]
          description: "`user` for every authenticated principal; `tenant-admin` when the principal carries one of the deployment's configured tenant-admin groups (`--tenant-admin-groups`, default `tenant-admin`)."
        csrfToken:
          type: string
          description: |
            Session-bound CSRF token — echo it in the `X-CSRF-Token` header on
            every mutating request. Derived from the session ID; never stored
            server-side and only valid for this session.
        sessionDomain:
          type: string
          description: "host[:port] under which workspace session hosts live"

    ConnectionStatus:
      type: object
      additionalProperties: false
      required: [state, leaseActive, streamEpoch]
      description: |
        Passive connection state of a workspace's interactive session.
        `none`: no live lease. `connected`: open stream on a fresh lease.
        `disconnected`: live lease with no open stream. `stale`: the lease has
        not been renewed within the freshness window.
      properties:
        state:
          type: string
          enum: [none, connected, disconnected, stale]
        leaseActive:
          type: boolean
        lastRenewedAt:
          type: string
          format: date-time
          description: Last lease renewal observed by the broker; absent when no live lease exists.
        leaseRef:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: |
            Opaque reference to the active lease (first 16 hex characters of
            the SHA-256 of the lease ID; never the ID itself). It changes when
            the session is taken over, so a tab can tell which lease it is
            looking at. Absent when there is no active lease.
        streamEpoch:
          type: integer
          format: int64
          minimum: 0
          description: |
            The active lease's stream epoch. It advances each time a stream is
            claimed on the lease, so a tab can tell that another stream has
            opened with the same lease (a duplicated tab). 0 when there is no
            active lease.
        streamOwnerTab:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: |
            Opaque per-tab id of the stream currently claimed on the lease
            (128 bits, lowercase hex): the portal mints it per browser tab and
            sends it with its stream claim, so a tab can tell that the live
            stream is its own — even across a backend restart that bumped the
            stream epoch — versus another tab's. Absent before the first stream
            claim, and never served to a session other than the one the lease
            was minted under — not even a second session of the same user.

    CreateConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        takeover:
          type: boolean
          default: false
          description: |
            When true and a live interactive lease exists, it is revoked and
            fenced before the new ticket becomes usable. When false a live
            lease yields `409 CONNECTION_IN_USE`.

    LaunchTicket:
      type: object
      additionalProperties: false
      required: [workspaceId, ticket, launchUrl, expiresAt]
      description: |
        One-time launch material for an interactive session. `ticket` is opaque,
        lives 60 s, is consumed on first redemption attempt (even if expired),
        and is stored server-side only as a hash. It is delivered in this
        response body only — the browser POSTs it to `launchUrl` on the session
        origin; it must never appear in a URL query string.
      properties:
        workspaceId:
          type: string
          pattern: "^ws_[A-Za-z0-9]{8,64}$"
        ticket:
          type: string
          minLength: 32
          description: Opaque single-use ticket (base64url, ~256 bits of entropy).
          example: "tkt_e3B0cmFuZG9tLWJ5dGVzLW9ubHk_0123abcd"
        launchUrl:
          type: string
          format: uri
          description: |
            Absolute URL on the workspace's own session host —
            `https://ws-<suffix>.<sessionDomain>/v1/launch` where `<suffix>`
            is the workspace ID suffix (see `GET /v1/me` for the configured
            session domain). The browser POSTs the ticket here; the
            gateway redeems it and redirects to a clean URL after setting the
            host-only session cookie.
          example: "https://ws-01j4z8kq2m9xnbv3t7yh0r6d5e.session.example.invalid/v1/launch"
        expiresAt:
          type: string
          format: date-time
          description: Ticket expiry (issued + 60 s).
        sessionPolicy:
          $ref: "#/components/schemas/ResolvedSessionPolicy"

    CreateFileTransferRequest:
      type: object
      additionalProperties: false
      required: [direction, path]
      properties:
        direction: {type: string, enum: [upload, download]}
        path:
          type: string
          minLength: 1
          maxLength: 255
          description: A file name inside the workspace's Transfers folder ($HOME/transfers). No directories.
        bytes: {type: integer, format: int64, minimum: 0, description: "Upload size in bytes (required for upload)."}

    FileTransfer:
      type: object
      additionalProperties: false
      required: [id, direction, path, declaredBytes, maxBytes, expiresAt, contentUrl]
      properties:
        id: {type: string, pattern: '^xf_[a-z2-7]{26}$'}
        direction: {type: string, enum: [upload, download]}
        path: {type: string}
        declaredBytes: {type: integer, format: int64}
        maxBytes: {type: integer, format: int64}
        expiresAt: {type: string, format: date-time}
        contentUrl: {type: string, format: uri, description: "Single-use URL on the workspace's session origin: PUT the bytes (upload) or GET them (download) with credentials, within 2 minutes."}

    TemplateView:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - family
        - revision
        - runtime
        - experience
        - resources
        - lifecycleDefaults
        - dataPolicyDefault
        - clipboardPolicy
        - fileTransferPolicy
        - networkProfile
        - publishedAt
      description: |
        Catalog entry. Revisions are immutable; end users can never supply raw
        PodSpecs, container commands or arbitrary VM manifests — only the
        profiles declared here.
      properties:
        id:
          type: string
          pattern: "^tpl_[A-Za-z0-9][A-Za-z0-9-]{6,62}[A-Za-z0-9]$"
        name:
          type: string
          example: linux-firefox-desktop
        family:
          type: string
          description: |
            Catalog name shared by every revision of one template; revisions
            of a family are grouped under it in the catalog.
          example: linux-firefox-desktop
        description:
          type: string
        revision:
          type: integer
          description: Immutable published revision.
        runtime:
          $ref: "#/components/schemas/RuntimeKind"
        experience:
          $ref: "#/components/schemas/ExperienceKind"
        resources:
          type: object
          additionalProperties: false
          required: [cpuMillicores, memoryMib, storageGib]
          properties:
            cpuMillicores:
              type: integer
              minimum: 1
              example: 4000
            memoryMib:
              type: integer
              minimum: 128
              example: 8192
            storageGib:
              type: integer
              minimum: 1
              example: 20
        lifecycleDefaults:
          type: object
          additionalProperties: false
          required: [idleTimeoutSeconds, disconnectGraceSeconds, maxRunningSeconds]
          properties:
            idleTimeoutSeconds:
              type: integer
              description: Stop after this much input idle time (default 1800).
              example: 1800
            disconnectGraceSeconds:
              type: integer
              description: Stop after this long with no connected session (default 600).
              example: 600
            maxRunningSeconds:
              type: integer
              description: Hard cap on a running incarnation (default 28800).
              example: 28800
        dataPolicyDefault:
          $ref: "#/components/schemas/DataPolicy"
        clipboardPolicy:
          type: string
          enum: [Disabled, Send, Receive, Bidirectional]
          description: |
            Clipboard redirection between the user's device and the
            workspace, named from the user's point of view and enforced
            server-side by the session server — this description is the
            single normative definition of the direction semantics
            (KasmVNC DLP keys in parentheses): `Disabled` allows neither
            direction; `Send` allows client to workspace only
            (`client_to_server`); `Receive` allows workspace to client
            only (`server_to_client`, primary selection included);
            `Bidirectional` allows both directions.
        fileTransferPolicy:
          type: string
          enum: [Disabled, Upload, Download, Bidirectional]
          description: |
            File transfer between the user's device and the workspace
            home (Upload = device to workspace, Download = workspace to
            device). Disabled unless the template opts in; the tenant
            ceiling can only narrow it.
        networkProfile:
          type: string
          enum: [InternetOnly, ClusterOnly, Isolated]
          description: |
            Runtime egress policy of the WorkspaceTemplate CRD —
            `InternetOnly` allows Internet egress, `ClusterOnly` restricts to
            in-cluster destinations, `Isolated` denies all egress except
            cluster DNS.
        publishedAt:
          type: string
          format: date-time
        imageBuiltAt:
          type: string
          format: date-time
          description: |
            Build timestamp of the runtime image (the template's
            workspaces.cdi.tinyorbit.vn/image-built-at annotation, rendered
            from images.<key>.builtAt or the seeded entry's imageBuiltAt).
            Absent when the template carries no parseable annotation.
        imageStale:
          type: boolean
          description: |
            True when the runtime image is older than the backend's
            -image-stale-after threshold (default 336h).
        imageBlocked:
          type: boolean
          description: |
            True when the runtime image is older than the backend's
            -image-block-after threshold (default 45 d, E3): a create or a
            start that cannot move to a fresher revision is refused with
            409 IMAGE_STALE. Absent when the template carries no parseable
            image-built-at — a missing annotation never blocks. False when
            the block is disabled (-image-block-after=0).
        imageEngines:
          type: object
          additionalProperties:
            type: string
          description: |
            Browser engine versions the runtime image was built with (the
            template's workspaces.cdi.tinyorbit.vn/image-chromium and
            image-firefox annotations, rendered from
            `images.<key>.engines.*`), e.g. `{"chromium": "154.0.8037.92",
            "firefox": "153.4.0esr"}`. Absent when the template declares
            none.

    TemplatePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TemplateView"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    RetainedDataState:
      type: string
      description: |
        `Retained → Attaching → Attached` and `Retained → Purging → Purged`.
        Transitions are conditional updates in the same transaction as quota
        reservation and the outbox intent, so attach and purge exclude each
        other.
      enum: [Retained, Attaching, Attached, Purging, Purged]

    RetainedDataView:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - owner
        - sizeGib
        - runtime
        - sourceWorkspaceName
        - retainedAt
        - purgeConfirmationNonce
      properties:
        id:
          type: string
          pattern: "^rd_[A-Za-z0-9]{8,64}$"
        state:
          $ref: "#/components/schemas/RetainedDataState"
        owner:
          $ref: "#/components/schemas/Owner"
        sizeGib:
          type: integer
          minimum: 1
          example: 20
        runtime:
          $ref: "#/components/schemas/RuntimeKind"
          description: Runtime family of the disk, to constrain attach templates.
        sourceWorkspaceName:
          type: string
          description: Display name of the workspace the disk was retained from.
          example: research-desktop
        consumingWorkspaceId:
          type: string
          pattern: "^ws_[A-Za-z0-9]{8,64}$"
          description: Present while `Attaching`/`Attached` — the workspace consuming the disk.
        retainedAt:
          type: string
          format: date-time
          description: When the disk entered the retained inventory.
        purgeConfirmationNonce:
          type: string
          description: |
            Short-lived, single-use nonce bound to this record, the caller's
            principal and the current record state. Echo it in
            `POST /v1/data/{id}:purge` to confirm destruction; a fresh nonce is
            issued on every read.

    RetainedDataPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetainedDataView"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    AttachDataRequest:
      type: object
      additionalProperties: false
      required: [name, templateRef]
      description: |
        Attach intent — equivalent to `POST /v1/workspaces` with
        `retainedDataRef`. `dataPolicy` of the new workspace is `Retain` by
        definition; the template's runtime must match the disk's runtime.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9-]{0,126}[a-z0-9]$|^[a-z0-9]$"
          example: restored-desktop
        templateRef:
          type: string
          pattern: "^tpl_[A-Za-z0-9][A-Za-z0-9-]{6,62}[A-Za-z0-9]$"
        desiredState:
          $ref: "#/components/schemas/DesiredState"

    PurgeDataRequest:
      type: object
      additionalProperties: false
      required: [confirmationNonce]
      properties:
        confirmationNonce:
          type: string
          minLength: 8
          description: Value of `purgeConfirmationNonce` from the latest read of the record.
