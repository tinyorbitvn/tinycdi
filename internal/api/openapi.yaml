            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserLimitDefault"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: putAdminUserLimitDefault
      summary: Set or clear the tenant's default user limit
      description: |
        Sets (integer `limit`) or clears (`limit: null`) the tenant-wide
        fallback running-workspace limit. Clearing restores unlimited.
        Requires the tenant-admin role on the named tenant, the
        `X-CSRF-Token` header and `If-Match`: the `ETag` of the last read,
        or `*` when no default is set. Every write is audited.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/IfMatch"
