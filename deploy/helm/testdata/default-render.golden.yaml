# Source: tinycdi/templates/backend.yaml
# Backend (cmd/backend): the public API and the session gateway in ONE
# deployment, with a separate TLS listener per role:
#   :8443 app      — public API /v1/* for the PORTAL host (the edge routes
#                    portalHost /v1/ here; everything else on that host
#                    goes to the frontend)
#   :8444 session  — session gateway for every <label>.<sessionDomain>
#                    workspace host (launch, desktop proxy, websockify)
#                    plus the in-cluster control surface (/healthz,
#                    /v1/control/*) on the Service names below
#   :9443 internal — mTLS broker listener for the operator (ADR 0003)
#   :9090 metrics  — only with backend.metrics.enabled, on its own
#                    ClusterIP Service (SEC-33)
# The gateway resolves launch tickets in-process — no gateway mTLS client.
#
# workspaces.cdi.tinyorbit.vn/role=gateway is what the operator's
# per-workspace NetworkPolicy matches on for runtime ingress (SEC-29).
#
# Restart safety (D22): two replicas with a shared -gateway-id,
# maxUnavailable=0 (a surge pod must be Ready before an old one drains),
# a PDB (minAvailable 1) and preferred node anti-affinity. SIGTERM starts
# Gateway.Drain inside the 30s termination grace period and holds both
# listeners for the whole -drain-window; clients reconnect to the other
# replica with the same session cookie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tcdi-system
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tinycdi
    app.kubernetes.io/instance: tcdi
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      # Never drop below the replica count: surge first, then drain the
      # old pod — a session replica stays available at every step (D22).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend, app.kubernetes.io/instance: tcdi}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: tcdi
        app.kubernetes.io/part-of: tinycdi
        cdi.tinyorbit.vn/needs-apiserver: "true"
        workspaces.cdi.tinyorbit.vn/role: gateway
    spec:
      serviceAccountName: backend
      # The API projects Workspace CRs and reads templates/secrets in the
      # managed namespaces (rbac.yaml backend-role).
      automountServiceAccountToken: true
      # SIGTERM fails readiness, then the pod waits
      # -drain-propagation-delay (backend.drainPropagationDelay, default
      # 5 s) for the endpoint removal to propagate while streams keep
      # flowing, closes them with a graceful 1001, and holds both
      # listeners for the whole -drain-window (default 8 s,
      # TCDI_DRAIN_WINDOW): reads answer, new launches/upgrades get a
      # retryable 503, then graceful listener shutdown — all under one
      # 24 s deadline (internal/backend). 30 s covers it with margin.
      # Never lower this below 30.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      # Spread replicas across nodes (P8: preferred, not required — a
      # required rule would strand the second replica on single-node
      # clusters). backend.affinity keys merge over this default.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: tcdi
                  app.kubernetes.io/name: backend
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
        - name: backend
          image: ghcr.io/tinyorbitvn/tinycdi-backend:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: app, containerPort: 8443}
            - {name: session, containerPort: 8444}
            - {name: internal, containerPort: 9443}
          args:
            # app listener: public API for the portal host.
            - -listen=:8443
            - -tls-cert=/tls/app/tls.crt
            - -tls-key=/tls/app/tls.key
            - -session-idle=30m
            # readiness drop -> endpoint-removal propagation wait ->
            # graceful 1001 stream close -> drain-window hold (FX-R34).
            - -drain-propagation-delay=5s
            - -drain-window=8s
            # Sign-out also ends the IdP session (RP-initiated logout).
            - --oidc-end-session=true
            # AEAD keys sealing the __Host-tcdi_login cookie (D20): the
            # FIRST file seals, every file opens — "previous" carries the
            # pre-rotation key while it exists in the Secret (in-cluster
            # lookup decides; under helm template/GitOps add
            # "-login-key-file=/login-keys/previous" via backend.extraArgs
            # during a rotation).
            - -login-key-file=/login-keys/current
            # session listener: session gateway on every workspace host
            # <label>.<sessionDomain> (D9).
            - -session-listen=:8444
            - -session-tls-cert=/tls/session/tls.crt
            - -session-tls-key=/tls/session/tls.key
            # /healthz and the bearer-gated /v1/control/* answer ONLY on
            # these Hosts — the in-cluster Service names — never on a
            # workspace host (D9); backend.controlHosts adds extras (the
            # allowlist compares the hostname sans port).
            - -session-control-hosts=backend,backend.tcdi-system,backend.tcdi-system.svc,backend.tcdi-system.svc.cluster.local
            # lax requires portal and session on the same registrable
            # domain; partitioned (SameSite=None; Secure; Partitioned) is
            # for cross-site deployments.
            - -session-cookie-mode=lax
            # internal listener: operator mTLS broker API (ADR 0003).
            - -internal-listen=:9443
            - -internal-tls-cert=/tls/internal/tls.crt
            - -internal-tls-key=/tls/internal/tls.key
            - -internal-client-ca=/etc/client-ca/ca.crt
            # shared: the session domain names the per-workspace hosts
            # (launch target + ticket audience); the portal origins are
            # the API CSRF Origin allowlist, the launch Origin allowlist
            # (ADR 0004) and the session listener's frame-ancestors.
            - -session-domain=session.lab.example.net
            - -portal-origin=https://portal.lab.example.net
            - -gateway-audience=session.lab.example.net
            # ONE identity for the whole Deployment (D19/D22): the lease
            # directory is shared, so a per-pod id would split ownership
            # across replicas. Literal value — never the pod name.
            - -gateway-id=tinycdi-backend
            # Rate-limit per-replica ceiling (RL-1, ADR 0006): the shared
            # Postgres window enforces -login-rate/-launch-rate as the
            # exact aggregate; each pod additionally keeps its budget
            # divided by this count as the local ceiling — the cap while
            # Postgres is healthy and the fail-open limit during a store
            # outage. Clamped to >= 1 — backend.replicas may be 0 (scaled
            # down), and a later out-of-band scale-up must not crash-loop
            # on a 0 divisor. Rendered before extraArgs so an override
            # there (e.g. an HPA's maxReplicas) wins.
            - -rate-limit-replicas=2
          env:
            - name: TCDI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tinycdi-backend-db
                  key: url
            # pgx honours the libpq env vars for DSN keys the URL omits —
            # an explicit sslmode= in the DSN still wins.
            - {name: PGSSLMODE, value: "verify-full"}
            - {name: TCDI_OIDC_ISSUER, value: "https://idp.lab.example.net/realms/tinycdi"}
            - {name: TCDI_OIDC_CLIENT_ID, value: "tinycdi"}
            - name: TCDI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tinycdi-oidc-client
                  key: client-secret
            - {name: TCDI_OIDC_REDIRECT_URL, value: "https://portal.lab.example.net/v1/auth/callback"}
            - {name: TCDI_TENANT_NAMESPACES, value: "tenant-a=tinycdi-tenant-a,tenant-b=tinycdi-tenant-b"}
            # Bounded tenant label values for session metrics/leases.
            - {name: TCDI_TENANT_ALLOWLIST, value: "tenant-a,tenant-b"}
          # /readyz answers 200 only once Run is serving AND the Workspace
          # informer cache has synced, and 503 as soon as shutdown starts.
          readinessProbe:
            httpGet: {path: /readyz, port: app, scheme: HTTPS}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup (migrations queued behind another replica, cache sync)
          # may take minutes; liveness only begins once /healthz answers.
          startupProbe:
            httpGet: {path: /healthz, port: app, scheme: HTTPS}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: app, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - {name: tls-app, mountPath: /tls/app, readOnly: true}
            - {name: tls-session, mountPath: /tls/session, readOnly: true}
            - {name: tls-internal, mountPath: /tls/internal, readOnly: true}
            - {name: client-ca, mountPath: /etc/client-ca, readOnly: true}
            - {name: login-keys, mountPath: /login-keys, readOnly: true}
      volumes:
        # One certificate per listener — the app, session and internal
        # listeners never share TLS material.
        - name: tls-app
          secret: {secretName: tinycdi-backend-app-tls}
        - name: tls-session
          secret: {secretName: tinycdi-backend-session-tls}
        - name: tls-internal
          secret: {secretName: tinycdi-backend-internal-tls}
        - name: client-ca
          # SEC-08: project ONLY the CA key — the Secret may also carry
          # tls.key (the cert-manager CA Secret does).
          secret:
            secretName: tinycdi-internal-ca
            items: [{key: ca.crt, path: ca.crt}]
        - name: login-keys
          # Login-state seal keys: "current" is required, "previous" is
          # mounted when the Secret carries it (key rotation).
          secret: {secretName: tinycdi-backend-login-keys}
---
# Source: tinycdi/templates/frontend.yaml
# Frontend (build/frontend): serves the built portal SPA over TLS with the
# portal security headers. Static files only — it does not proxy /v1; the
# edge routes portalHost /v1/ to the backend app listener. No apiserver
# access — its ServiceAccount has automountServiceAccountToken=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tcdi-system
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: tinycdi
    app.kubernetes.io/instance: tcdi
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      # Never drop below the replica count: surge first, then drain the
      # old pod — the portal stays available at every step (E4/D22).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend, app.kubernetes.io/instance: tcdi}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: tcdi
        app.kubernetes.io/part-of: tinycdi
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      # SIGTERM fails /healthz, then the frontend keeps serving for
      # -drain-delay (frontend.drainDelay, default 8s) while the pod's
      # endpoint removal propagates to kube-proxy / the edge — a rollover
      # never routes to a dead pod (FX-R35). 30 s covers the delay plus a
      # graceful listener shutdown with margin (render-time bound:
      # drainDelay <= 20s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: frontend
          image: ghcr.io/tinyorbitvn/tinycdi-frontend:0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:8443
            # pre-stop drain (FX-R35): /healthz fails on SIGTERM and the
            # server keeps serving this long while the endpoint removal
            # propagates, then shuts down gracefully.
            - -drain-delay=8s
            # The SPA shows sessions in an iframe on each workspace's own
            # <label>.<sessionDomain> host and launches them with a form
            # POST there — the CSP frame-src and form-action get the
            # https://*.<sessionDomain> wildcard or every session is
            # CSP-blocked (D14).
            - -session-domain=session.lab.example.net
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            initialDelaySeconds: 2
            periodSeconds: 5
            # One miss flips Ready — on drain /healthz fails at once and
            # the pod must leave the endpoints fast (FX-R35).
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: tinycdi-frontend-tls}
---
# Source: tinycdi/templates/operator.yaml
# Operator (cmd/operator). Its ClusterRole is bound ONLY via RoleBindings
# in the managed namespaces (rbac.yaml — never the release namespace,
# SEC-09), so --watch-namespaces pins the informer cache to exactly that
# allowlist. POD_NAMESPACE (downward API) is the release namespace — the
# leader-election Lease lives there via its own Role, and the runtime
# backend uses it as the default --gateway-namespace (SEC-29).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: tcdi-system
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/part-of: tinycdi
    app.kubernetes.io/instance: tcdi
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: operator, app.kubernetes.io/instance: tcdi}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator
        app.kubernetes.io/instance: tcdi
        app.kubernetes.io/part-of: tinycdi
        cdi.tinyorbit.vn/needs-apiserver: "true"
    spec:
      serviceAccountName: operator
      automountServiceAccountToken: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
        - name: operator
          image: ghcr.io/tinyorbitvn/tinycdi-operator:0.2.0
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
            # Metrics stay OFF (SEC-33): controller-runtime's secure mode
            # also enables the authn/authz filter, which needs
            # cluster-scoped TokenReview/SAR RBAC this chart never grants;
            # plain-HTTP metrics are not offered either.
            - --metrics-bind-address=0
            - --webhook-port=-1
            - --leader-elect=true
            - --leader-election-namespace=tcdi-system
            - --watch-namespaces=tinycdi-tenant-a,tinycdi-tenant-b
