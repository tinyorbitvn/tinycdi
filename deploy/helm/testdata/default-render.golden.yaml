            - message: spec.ownerSubject is immutable
              rule: self.ownerSubject == oldSelf.ownerSubject
            - message: spec.dataPolicy is immutable
              rule: self.dataPolicy == oldSelf.dataPolicy
            - message: spec.runtimeGeneration must not decrease
              rule: self.runtimeGeneration >= oldSelf.runtimeGeneration
            - message: spec.intentRevision must not decrease
