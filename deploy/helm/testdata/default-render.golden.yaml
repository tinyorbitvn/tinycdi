            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - {name: broker-ca, mountPath: /etc/broker-ca, readOnly: true}
            - {name: mtls, mountPath: /mtls, readOnly: true}
      volumes:
        - name: broker-ca
          secret:
            secretName: tinycdi-internal-ca
            # SEC-08: project ONLY the CA key — the Secret may also carry
            # tls.key (the cert-manager CA Secret does).
            items: [{key: ca.crt, path: ca.crt}]
        - name: mtls
          secret: {secretName: tinycdi-operator-mtls}
