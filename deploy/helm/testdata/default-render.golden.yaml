# Source: tinycdi/templates/workspacetemplates.yaml
# Seeded WorkspaceTemplates — the runtime catalog. spec passes through
# (the CRD validates it: digest-pinned image, enum fields, ...) except
# two chart fills: spec.linux.image resolves from `image:`/images keys,
# and spec.linux.adapter is rendered explicitly ("" is the value the API
# server would store anyway — GitOps diffing then shows no drift). Once
# created, CEL makes spec immutable. So every distinct rendered
# content becomes a NEW revision object instead of an in-place mutation:
# metadata.name is "<name>-<hash8>" where hash8 = sha256 of the rendered
# spec + effective annotations. A values change renders a new name; helm
# creates the new revision and deletes the superseded one — upgrades and
# rollbacks never touch a live template's spec. The catalog-name label
# ties the revisions of one logical template together: the API resolves
# tpl_<name> (and lists) to the newest published revision.
#
# Per-entry structured fields map to the annotations the runtime backend
# honors (internal/runtime/linux/backend.go). The v0.1 nodeSelector entry
# field is gone (E14): the render fails below — pod placement lives in the
# typed spec.placement block, with unset fields falling back to the
# operator defaults rendered from runtime.placement.
#   image:           key into .Values.images (e.g. "linuxDesktop",
#                    "browser") or a literal reference; used when
#                    spec.linux.image is empty. Runtime images must be
#                    digest-pinned — the CRD rejects tag-only references.
#   imageBuiltAt:    -> workspaces.cdi.tinyorbit.vn/image-built-at for literal
#                    image references (entries using an images key take
#                    images.<key>.builtAt instead; images.<key>.engines.*
#                    likewise render as image-chromium/image-firefox)
#   seccompProfile:  -> workspaces.cdi.tinyorbit.vn/seccomp-profile: localhost/<name>
#   appArmorProfile: -> workspaces.cdi.tinyorbit.vn/apparmor-profile: localhost/<name>
#   storageClass:    -> workspaces.cdi.tinyorbit.vn/storage-class
#                    (falls back to the top-level storageClass value)
#   annotations:     -> extra annotations, verbatim
