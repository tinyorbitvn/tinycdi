# Portal (build/portal): TLS terminator serving the web bundle and proxying
# /v1 -> api:8080 so browsers stay same-origin. No apiserver access —
# its ServiceAccount has automountServiceAccountToken=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "portal" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: portal, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: tinycdi
      {{- with .Values.portal.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: portal
      automountServiceAccountToken: false
      securityContext:
        {{- include "tinycdi.podSecurityContext" .Values.portal.podSecurityContext | nindent 8 }}
      {{- include "tinycdi.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.portal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.portal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.portal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: {{ include "tinycdi.image" (dict "image" .Values.images.portal "root" $) }}
          imagePullPolicy: {{ include "tinycdi.imagePullPolicy" .Values.images.portal.pullPolicy }}
          args:
            - -listen=:8443
            - -api-upstream={{ .Values.portal.apiUpstream | default (printf "http://api.%s.svc:8080" .Release.Namespace) }}
            # The SPA launch form POSTs cross-origin to the session host —
            # the portal CSP form-action must name it or every launch is
            # CSP-blocked.
            - -session-origin={{ printf "https://%s" .Values.sessionHost }}
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            {{- if .Values.portal.webRoot }}
            - -web-root={{ .Values.portal.webRoot }}
            {{- end }}
            {{- with .Values.portal.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.portal.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            {{- include "tinycdi.containerSecurityContext" .Values.portal.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.portal.tls.existingSecret }}}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "portal" "root" $) | nindent 4 }}
  {{- with .Values.portal.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.portal.service.type }}
  selector: {app.kubernetes.io/name: portal, app.kubernetes.io/instance: {{ .Release.Name }}}
  {{- with .Values.portal.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.portal.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: https
      port: 443
      targetPort: https
      {{- if and (eq .Values.portal.service.type "NodePort") .Values.portal.service.nodePort }}
      nodePort: {{ .Values.portal.service.nodePort }}
      {{- end }}
