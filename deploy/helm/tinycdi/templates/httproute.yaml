{{- if .Values.gatewayApi.enabled }}
# Gateway API exposure for both public edges. Portal host: /v1 -> backend
# app listener, everything else -> frontend. Session host: everything ->
# backend session listener. Every backend speaks HTTPS — the Gateway
# listener must terminate TLS and re-encrypt to the backend (e.g. a
# BackendTLSPolicy per Service, or your implementation's equivalent);
# plain HTTP forwarding to these Services will not work.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "frontend" "root" $) | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.portalHost | quote }}]
  rules:
    # PathPrefix matches per path element: /v1 matches /v1 and /v1/...,
    # never /v1x. The longest prefix wins, so /v1 beats / below.
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - name: backend
          port: 8443
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.sessionHost | quote }}]
  rules:
    - backendRefs:
        - name: backend
          port: 8444
{{- end }}
