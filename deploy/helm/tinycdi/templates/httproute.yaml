{{- if .Values.gatewayApi.enabled }}
# Gateway API exposure for both public edges. Both backends speak HTTPS —
# the Gateway listener must terminate TLS and re-encrypt/pass through to
# the backend (e.g. Envoy Gateway BackendTLSPolicy targeting the Service);
# plain HTTP forwarding to these Services will not work.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "portal" "root" $) | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.portalHost | quote }}]
  rules:
    - backendRefs:
        - name: portal
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "gateway" "root" $) | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.sessionHost | quote }}]
  rules:
    - backendRefs:
        - name: gateway
          port: 443
{{- end }}
