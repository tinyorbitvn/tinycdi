# Platform ServiceAccounts (release namespace) plus one tinycdi-runtime SA
# per managed namespace with automountServiceAccountToken=false — runtime
# pods never get a token (the operator also sets it on the pod spec).
{{- range list "backend" "operator" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" . "root" $) | nindent 4 }}
automountServiceAccountToken: {{ ne . "frontend" }}   # SEC-34: the frontend never calls the apiserver
{{- end }}
{{- range .Values.managedNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tinycdi-runtime
  namespace: {{ .name }}
  labels:
    workspaces.cdi.tinyorbit.vn/tenant: {{ .tenant }}
    {{- include "tinycdi.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
