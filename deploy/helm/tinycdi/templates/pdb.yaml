# Optional PodDisruptionBudgets, one per component with
# <component>.podDisruptionBudget.enabled=true.
{{- range $component := list "api" "operator" "gateway" "portal" }}
{{- $cfg := index $.Values $component }}
{{- if and $cfg.podDisruptionBudget $cfg.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" $component "root" $) | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $component }}, app.kubernetes.io/instance: {{ $.Release.Name }}}
  {{- if $cfg.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ $cfg.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable | default 1 }}
  {{- end }}
{{- end }}
{{- end }}
