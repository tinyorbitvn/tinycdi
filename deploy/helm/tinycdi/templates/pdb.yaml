# Optional PodDisruptionBudgets, one per component. backend and frontend
# use <component>.pdb, operator keeps <component>.podDisruptionBudget.
# The PDB renders when the block's `enabled` is true, or — when no
# `enabled` key is present — when a sizing key (minAvailable /
# maxUnavailable) is set; all three ship ON by default with
# minAvailable:1 (D22 backend, E4 operator+frontend).
{{- range $component := list "backend" "operator" "frontend" }}
{{- $cfg := index $.Values $component }}
{{- $pdb := default dict ($cfg.pdb | default $cfg.podDisruptionBudget) }}
{{- $enabled := or (not (empty $pdb.minAvailable)) (not (empty $pdb.maxUnavailable)) }}
{{- if hasKey $pdb "enabled" }}
{{- $enabled = $pdb.enabled }}
{{- end }}
{{- if $enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" $component "root" $) | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $component }}, app.kubernetes.io/instance: {{ $.Release.Name }}}
  {{- if $pdb.maxUnavailable }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  {{- end }}
{{- end }}
{{- end }}
