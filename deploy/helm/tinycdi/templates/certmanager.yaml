{{- if .Values.certManager.enabled }}
# cert-manager integration for the INTERNAL mTLS chain only
# (operator -> backend broker, ADR 0003). The Certificates below produce
# the Secrets referenced by backend.tls.internal.existingSecret and
# operator.brokerClient.mtls.existingSecret — the pods keep consuming plain
# secret volumes either way.
#
# Public-edge certs (backend.tls.app, backend.tls.session, frontend.tls)
# are NOT issued here: point them at certificates from your PKI/ACME flow.
{{- if .Values.certManager.selfSigned }}
---
# Bootstrap: self-signed root -> CA Certificate -> CA Issuer. Only enable
# for closed deployments without an existing internal PKI.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-selfsigned
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-internal-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
spec:
  secretName: {{ include "tinycdi.internalCASecret" . }}
  isCA: true
  commonName: tinycdi-internal-ca
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Release.Namespace }}-{{ .Release.Name }}-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Release.Name }}-internal-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
spec:
  ca:
    secretName: {{ include "tinycdi.internalCASecret" . }}
{{- end }}
---
# backend internal broker listener (:9443) server certificate — the
# operator dials https://backend.<namespace>.svc:9443.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-backend-internal-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
spec:
  secretName: {{ .Values.backend.tls.internal.existingSecret }}
  commonName: backend.{{ .Release.Namespace }}.svc
  dnsNames:
    - backend
    - backend.{{ .Release.Namespace }}
    - backend.{{ .Release.Namespace }}.svc
    - backend.{{ .Release.Namespace }}.svc.cluster.local
  usages: [server auth]
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  issuerRef:
    {{- include "tinycdi.leafIssuerRef" . | nindent 4 }}
---
# operator broker client certificate. The commonName MUST match
# backend.operatorCN (default "operator") — the internal workspace
# revoke/drain routes accept no other client identity.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-operator-mtls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "operator" "root" $) | nindent 4 }}
spec:
  secretName: {{ .Values.operator.brokerClient.mtls.existingSecret }}
  commonName: {{ .Values.backend.operatorCN | default "operator" }}
  usages: [client auth]
  duration: {{ .Values.certManager.duration }}
  renewBefore: {{ .Values.certManager.renewBefore }}
  issuerRef:
    {{- include "tinycdi.leafIssuerRef" . | nindent 4 }}
{{- end }}
