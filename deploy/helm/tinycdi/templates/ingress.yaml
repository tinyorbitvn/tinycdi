{{- if .Values.ingress.enabled }}
# Portal host and session DOMAIN are disjoint (portalHost may not equal
# or sit inside sessionDomain — enforced by tinycdi.validate). Portal
# host: /v1 -> backend app listener, everything else -> frontend.
# Session edge: ONE wildcard host *.<sessionDomain> covers every
# workspace's <label>.<sessionDomain> host -> backend session listener
# (D9); the TLS Secret named below must hold a wildcard certificate.
# Every backend terminates TLS itself — set backend-protocol / pass-through
# annotations for your controller via ingress.annotations (e.g. nginx
# backend-protocol: HTTPS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "frontend" "root" $) | nindent 4 }}
  {{- $ann := merge (deepCopy .Values.ingress.portalAnnotations) .Values.ingress.annotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.portalHost }}
      http:
        paths:
          # Prefix matching is per path element: /v1 matches /v1 and
          # /v1/..., never /v1x.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {name: app}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {name: https}
  {{- with .Values.ingress.tls.existingSecret }}
  tls:
    - hosts: [{{ $.Values.portalHost }}]
      secretName: {{ . }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
  {{- $sann := merge (deepCopy .Values.ingress.sessionAnnotations) .Values.ingress.annotations }}
  {{- with $sann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ printf "*.%s" .Values.sessionDomain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {name: session}
  {{- with .Values.ingress.tls.existingSecret }}
  tls:
    # The Secret's certificate must cover the *.<sessionDomain> wildcard
    # (DNS-01 — HTTP-01 cannot issue wildcards).
    - hosts: [{{ printf "*.%s" $.Values.sessionDomain | quote }}]
      secretName: {{ . }}
  {{- end }}
{{- end }}
