# Session gateway (cmd/gateway): public TLS edge for runtime streams.
# workspaces.cdi.tinyorbit.vn/role=gateway is what the operator's per-workspace
# NetworkPolicy matches on for runtime ingress.
#
# Flag surface is parameterized: stable flags come from structured values
# (incl. the optional /v1/control/* token, gateway.controlToken — unset
# means the control routes stay closed); anything else is injected through
# gateway.extraArgs / extraEnv / extraVolumes / extraVolumeMounts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "gateway" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: tinycdi
        workspaces.cdi.tinyorbit.vn/role: gateway
      {{- with .Values.gateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false   # SEC-34: the gateway never calls the apiserver
      securityContext:
        {{- include "tinycdi.podSecurityContext" .Values.gateway.podSecurityContext | nindent 8 }}
      {{- include "tinycdi.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "tinycdi.image" (dict "image" .Values.images.gateway "root" $) }}
          imagePullPolicy: {{ include "tinycdi.imagePullPolicy" .Values.images.gateway.pullPolicy }}
          ports:
            - {name: https, containerPort: 8443}
            {{- if .Values.gateway.metricsListen }}
            - {name: metrics, containerPort: {{ .Values.gateway.metricsListen | trimPrefix ":" | int }}}
            {{- end }}
          args:
            - -listen=:8443
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -public-origin={{ printf "https://%s" .Values.sessionHost }}
            # Origins allowed to POST /v1/launch (ADR 0004): the portal is a
            # different registrable domain, so launches arrive cross-site.
            {{- range prepend (.Values.gateway.extraPortalOrigins | default (list)) (printf "https://%s" .Values.portalHost) }}
            - -portal-origin={{ . }}
            {{- end }}
            # Host-header allowlist compares the hostname sans port.
            - -allowed-hosts={{ $hosts := prepend .Values.gateway.extraAllowedHosts .Values.sessionHost }}{{ join "," $hosts }}
            # internal broker (api mTLS listener); audience must equal the
            # api's session-origin hostname.
            - -broker-url={{ printf "https://api-internal.%s.svc:9443" .Release.Namespace }}
            - -mtls-cert=/mtls/tls.crt
            - -mtls-key=/mtls/tls.key
            - -gateway-audience={{ .Values.gateway.audience | default .Values.sessionHost }}
            - -tenant-allowlist={{ include "tinycdi.tenantAllowlist" . }}
            {{- if .Values.gateway.id }}
            - -gateway-id={{ .Values.gateway.id }}
            {{- end }}
            {{- if .Values.gateway.trustedCA.existingSecret }}
            - -broker-ca=/etc/broker-ca/{{ .Values.gateway.trustedCA.key | default "ca.crt" }}
            {{- end }}
            {{- if .Values.gateway.upstreamCA.existingSecret }}
            - -upstream-ca=/etc/upstream-ca/{{ .Values.gateway.upstreamCA.key | default "ca.crt" }}
            {{- end }}
            {{- if .Values.gateway.metricsListen }}
            - -metrics-listen={{ .Values.gateway.metricsListen }}
            {{- end }}
            {{- if .Values.gateway.controlToken.existingSecret }}
            - -control-token-file=/control/{{ .Values.gateway.controlToken.key }}
            {{- end }}
            {{- with .Values.gateway.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.gateway.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            {{- include "tinycdi.containerSecurityContext" .Values.gateway.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: mtls, mountPath: /mtls, readOnly: true}
            {{- if .Values.gateway.trustedCA.existingSecret }}
            - {name: broker-ca, mountPath: /etc/broker-ca, readOnly: true}
            {{- end }}
            {{- if .Values.gateway.upstreamCA.existingSecret }}
            - {name: upstream-ca, mountPath: /etc/upstream-ca, readOnly: true}
            {{- end }}
            {{- if .Values.gateway.controlToken.existingSecret }}
            - {name: control-token, mountPath: /control, readOnly: true}
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tls
          secret: {secretName: {{ .Values.gateway.tls.existingSecret }}}
        - name: mtls
          secret: {secretName: {{ .Values.gateway.mtls.existingSecret }}}
        {{- if .Values.gateway.trustedCA.existingSecret }}
        - name: broker-ca
          # SEC-08: project ONLY the CA key — the Secret may also carry
          # tls.key (the cert-manager CA Secret does).
          secret:
            secretName: {{ .Values.gateway.trustedCA.existingSecret }}
            items: [{key: {{ .Values.gateway.trustedCA.key | default "ca.crt" }}, path: {{ .Values.gateway.trustedCA.key | default "ca.crt" }}}]
        {{- end }}
        {{- if .Values.gateway.upstreamCA.existingSecret }}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.gateway.upstreamCA.existingSecret }}
            items: [{key: {{ .Values.gateway.upstreamCA.key | default "ca.crt" }}, path: {{ .Values.gateway.upstreamCA.key | default "ca.crt" }}}]
        {{- end }}
        {{- if .Values.gateway.controlToken.existingSecret }}
        - name: control-token
          secret: {secretName: {{ .Values.gateway.controlToken.existingSecret }}}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "gateway" "root" $) | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  {{- with .Values.gateway.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.gateway.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: https
      port: 443
      targetPort: https
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
    # SEC-33: metrics are NEVER exposed on this public Service — when
    # gateway.metricsListen is set they live on the dedicated ClusterIP
    # gateway-metrics Service below, reachable only via the
    # allow-metrics-scrape NetworkPolicy peers.
{{- if .Values.gateway.metricsListen }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    cdi.tinyorbit.vn/metrics: "true"
    {{- include "tinycdi.componentLabels" (dict "component" "gateway" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: metrics, port: {{ .Values.gateway.metricsListen | trimPrefix ":" | int }}, targetPort: metrics}
{{- end }}
