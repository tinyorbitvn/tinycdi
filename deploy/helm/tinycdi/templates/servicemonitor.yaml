{{- if .Values.serviceMonitor.enabled }}
# ServiceMonitor for the backend metrics endpoint (backend.metrics) on the
# dedicated ClusterIP backend-metrics Service — the operator has no
# metrics endpoint (SEC-33: secure metrics need cluster-scoped authz RBAC
# the chart never grants; HTTP is banned). Prometheus Operator must be
# installed; serviceMonitor.labels selects it.
{{- if .Values.backend.metrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinycdi.componentLabels" (dict "component" "backend" "root" $) | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
      cdi.tinyorbit.vn/metrics: "true"
  endpoints:
    - port: metrics
      {{- with .Values.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
{{- end }}
{{- end }}
