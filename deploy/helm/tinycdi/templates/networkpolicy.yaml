{{- if .Values.networkPolicy.enabled }}
# Default-deny baseline: nothing talks unless a policy below allows it.
# Managed namespaces get ONLY the baseline — the operator converges a
# per-workspace boundary policy for each runtime pod.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- range .Values.managedNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .name }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- end }}
---
# Cluster DNS for every pod in the release namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml .Values.networkPolicy.dnsPeers | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Pods that must reach the kube-apiserver (backend: CR projection; operator:
# watches). Peers are values — point them at
# the kubernetes.default Service IP of YOUR cluster (see install.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {cdi.tinyorbit.vn/needs-apiserver: "true"}
  policyTypes: [Egress]
  egress:
    - to: {{- toYaml .Values.networkPolicy.apiServerPeers | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.apiServerPort }}}
{{- $edge := .Values.networkPolicy.edgeIngress | default "ipBlock" }}
---
# backend: app (:8443) and session (:8444, every <label>.<sessionDomain>
# workspace host) take traffic from the edge only (see
# networkPolicy.edgeIngress) — plus the in-cluster control surface on
# :8444 from the release namespace; the internal mTLS listener
# (:9443) only from the operator. Egress: OIDC issuer, PostgreSQL and the
# runtime pods in managed namespaces (streaming port); apiserver and DNS
# come from the shared policies above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backend}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- include "tinycdi.edgeIngressRule" (dict "root" $ "ports" (list 8443 8444)) | nindent 4 }}
    # Session control surface (D9): /healthz and the bearer-gated
    # /v1/control/* on :8444 answer only on the in-cluster Service names
    # (-session-control-hosts), never on a workspace host. Pods in the
    # release namespace (operator, admin/tooling Jobs) may reach it even
    # when edgeIngressCIDRs is narrowed to the load-balancer range.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
      ports:
        - {protocol: TCP, port: 8444}
    # internal mTLS listener (ADR 0003): the operator's teardown
    # revoke/drain seam only — the session gateway reaches the broker
    # in-process.
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: operator}
      ports:
        - {protocol: TCP, port: 9443}
  egress:
    - to:
        {{- range .Values.oidc.egressCIDRs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.oidc.port }}}
    - to: {{- toYaml .Values.database.allowedPeers | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.database.port }}}
    - to:
        - namespaceSelector:
            matchExpressions:
              - {key: workspaces.cdi.tinyorbit.vn/tenant, operator: Exists}
      ports: [{protocol: TCP, port: 8443}]
---
# frontend: static SPA server. Ingress from the edge only; no egress at all
# beyond DNS (it proxies nothing).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: frontend}
  policyTypes: [Ingress, Egress]
  {{- if eq $edge "cilium" }}
  # edge ingress: the frontend-edge-ingress CiliumNetworkPolicy below.
  ingress: []
  {{- else }}
  ingress:
    {{- include "tinycdi.edgeIngressRule" (dict "root" $ "ports" (list 8443)) | nindent 4 }}
  {{- end }}
  egress: []
{{- if eq $edge "cilium" }}
---
# Edge ingress, Cilium mode (GitHub issue #13): Cilium's Gateway API /
# Ingress envoy runs in the host network namespace, so its traffic carries
# the ingress/host/remote-node identity — CIDR selectors never match it,
# and an ipBlock edge rule 503s every request. Admit exactly those
# entities, on the TLS ports only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-edge-ingress
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: backend}
  ingress:
    - fromEntities: [ingress, host, remote-node]
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
            - {port: "8444", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-edge-ingress
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: frontend}
  ingress:
    - fromEntities: [ingress, host, remote-node]
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
{{- end }}
---
# operator: reaches the backend internal mTLS listener for the teardown
# finalizer's revoke/drain seam (ADR 0003). apiserver + DNS egress come
# from the shared policies above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: operator}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: backend}
      ports: [{protocol: TCP, port: 9443}]
{{- if .Values.backend.metrics.enabled }}
---
# Metrics scraping: the declared Prometheus peers may reach the backend
# metrics port — scoped to backend pods (never podSelector {}, SEC-33) on
# the dedicated backend-metrics Service port. prometheusPeers empty fails
# the render (SEC-32, see tinycdi.validate).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backend}
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.prometheusPeers | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.backend.metrics.port | int }}}
{{- end }}
{{- end }}
