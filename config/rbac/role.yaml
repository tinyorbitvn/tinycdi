---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspaces
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspaces/finalizers
  verbs:
  - update
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspaces/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspacetemplates
  verbs:
  - get
  - list
  - watch
