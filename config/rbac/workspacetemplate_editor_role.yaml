# This rule is not used by the project platform itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the workspaces.cdi.tinyorbit.vn.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/managed-by: kustomize
  name: workspacetemplate-editor-role
rules:
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspacetemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workspaces.cdi.tinyorbit.vn
  resources:
  - workspacetemplates/status
  verbs:
  - get
