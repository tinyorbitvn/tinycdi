# SEC-31: a namespaced RoleBinding, never a ClusterRoleBinding — the
# manager ClusterRole is bound only inside the deployment namespace
# (kustomize `namespace:`), matching the Helm chart's posture.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/managed-by: kustomize
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
