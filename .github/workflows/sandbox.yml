---
# sandbox.yml — sandboxed-runtime matrix (E12): workspace pods under gVisor
# (runsc) on kind. Results feed docs/compatibility.md "Sandboxed runtimes".
#
#   gvisor  — creates the quickstart kind cluster, installs gVisor
#             (runsc) into the node and registers the RuntimeClass
#             (hack/quickstart/sandbox-gvisor.sh), installs TinyCDI with
#             values-sandbox.yaml (templates carry
#             spec.placement.runtimeClassName: gvisor), then runs the
#             pod-level check suite (sandbox-check.sh: ready, runtime
#             marker, RFB stream + input, stop/start + retained disk) and
#             the regular portal smoke for the embedded path.
#
# NOT a required check — advisory signal only (weekly + manual dispatch).
# Every action is pinned by full commit SHA (version in the trailing
# comment); downloaded tools by exact version + sha256, matching ci.yml.

name: sandbox

"on":
  schedule:
    - cron: "23 4 * * 3"  # weekly sandboxed-runtime matrix (Wed 04:23 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GitHub's default run shell is `bash -e` — no pipefail — so a failing
# command piped into tee/grep exits 0 and masks a gate failure (KASM-4).
# `shell: bash` selects `bash --noprofile --norc -eo pipefail` for every
# run step.
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22.23.3"
  HELM_VERSION: "v4.1.3"
  HELM_TGZ_SHA256: "02ce9722d541238f81459938b84cf47df2fdf1187493b4bfb2346754d82a4700"
  KIND_VERSION: "0.33.0"
  KIND_BIN_SHA256: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
  TCDI_QS_CLUSTER: tcdi-sandbox

jobs:
  gvisor:
    name: gVisor on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hack/quickstart/smoke/package-lock.json
      - name: shellcheck quickstart scripts
        run: shellcheck -x hack/quickstart/*.sh
      - name: install helm ${{ env.HELM_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz"
          echo "${{ env.HELM_TGZ_SHA256 }}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C "$HOME/.local/bin" --strip-components=1 linux-amd64/helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install kind v${{ env.KIND_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${{ env.KIND_VERSION }}/kind-linux-amd64"
          echo "${{ env.KIND_BIN_SHA256 }}  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          "$HOME/.local/bin/kind" version
      - name: sandbox-up.sh (kind + gVisor + TinyCDI; budget 25 min)
        # ubuntu-24.04 runners expose /dev/kvm, so sandbox-gvisor.sh picks
        # the kvm platform inside the node container automatically.
        run: |
          start="$(date +%s)"
          timeout --signal=TERM 1500 hack/quickstart/sandbox-up.sh
          echo "sandbox-up.sh took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: sandbox-check.sh (pod-level matrix)
        run: |
          export KUBECONFIG="$HOME/.local/state/tcdi-quickstart/${TCDI_QS_CLUSTER}/kubeconfig"
          timeout --signal=TERM 900 hack/quickstart/sandbox-check.sh | tee "$RUNNER_TEMP/sbx-check.log"
          grep -c '^RESULT PASS' "$RUNNER_TEMP/sbx-check.log" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: install playwright chromium
        working-directory: hack/quickstart/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: portal smoke (session frame + input under runsc; retained-disk attach)
        working-directory: hack/quickstart/smoke
        # The seeded templates carry runtimeClassName: gvisor, so the
        # smoke's browser workspace runs under runsc — this exercises the
        # real embedded path (portal iframe -> gateway -> pod stream).
        run: |
          export KUBECONFIG="$HOME/.local/state/tcdi-quickstart/${TCDI_QS_CLUSTER}/kubeconfig"
          npx playwright test
      - name: diagnostics
        if: failure()
        run: |
          export KUBECONFIG="$HOME/.local/state/tcdi-quickstart/${TCDI_QS_CLUSTER}/kubeconfig"
          kubectl get pods -A -o wide || true
          kubectl get workspaces,workspacetemplates -A || true
          kubectl -n tinycdi-system logs deploy/backend --tail=100 || true
          kubectl -n tinycdi-system logs deploy/operator --tail=100 || true
          kubectl -n tcdi-qs-deps logs deploy/keycloak --tail=60 || true
          docker exec "${TCDI_QS_CLUSTER}-control-plane" crictl ps -a | tail -20 || true
      - name: upload smoke report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sandbox-smoke
          path: hack/quickstart/smoke/test-results
          if-no-files-found: ignore
      - name: down.sh leaves no kind cluster
        if: always()
        run: |
          hack/quickstart/down.sh
          hack/quickstart/down.sh   # idempotent: a second run is a no-op
          if kind get clusters 2>/dev/null | grep -q .; then
            echo "::error::kind clusters left behind:"
            kind get clusters
            exit 1
          fi
