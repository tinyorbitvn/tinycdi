---
# images.yml — build, scan and publish the six TinyCDI images to GHCR.
#
# Triggered on every push to main (tags sha-<short> + main) and manually via
# workflow_dispatch (optional `platforms` input to opt into arm64 — the
# default is linux/amd64 only).
#
# Pipeline shape (SEC-04/SEC-05):
#   1. build jobs   — docker/build-push-action pushes BY DIGEST ONLY
#                     (push-by-digest=true, no tags). `packages: write`,
#                     docker/first-party actions only, registry secrets scoped
#                     to the login step, `docker logout` at the end. The same
#                     job generates the SPDX SBOM with sha256-pinned syft —
#                     promote never consumes scan-job outputs (SUPR-2).
#   2. scan job     — separate job holding only `packages: read` +
#                     security-events/actions for SARIF: no secrets, no
#                     id-token, no attestations. trivy is installed from a
#                     pinned, sha256-verified tarball and runs with an empty
#                     --config + the effective --ignorefile generated at
#                     scan time (SUPR-3/SUPR-8).
#   3. promote job  — first-party actions + pinned cosign-installer only:
#                     cosign signs the scanned digest and attaches the SBOM
#                     attestation FIRST, then `imagetools create` promotes
#                     it to :sha-<short>/:main (SUPR-13).
#
# Publishing happens only when github.ref == 'refs/heads/main' (SUP-3) —
# a dispatch from another ref builds and scans but never pushes or tags.
#
# Every action is pinned by full commit SHA (version in the trailing
# comment); downloaded tools are sha256-verified.
#
# Tool pins:
#   syft 1.52.0   — anchore release tarball, sha256-verified below
#   trivy 0.70.0  — aquasecurity release tarball, sha256-verified below
#   cosign v3.1.3 — sigstore release binary, sha256-verified below
#
# Topology: `browser` FROMs `linux-desktop` (ARG BASE_IMAGE), and the
# docker-container buildx builder cannot see the daemon's image store —
# so linux-desktop builds first in its own `desktop` job and the browser
# leg consumes the exact pushed manifest by digest
#   BASE_IMAGE=ghcr.io/tinyorbitvn/tinycdi-linux-desktop@sha256:<digest>
# (on non-publishing runs it consumes the desktop image-tar artifact via
# docker load instead). The digest is the manifest list, so under a
# multi-platform dispatch each browser platform resolves the matching
# desktop variant.
#
# OCI labels: every image is stamped with org.opencontainers.image.*
# labels (source, licenses, title, description, version, revision,
# created) so the GHCR package pages link back to this repository.
#
# Vulnerability gate (SEC-44): TRIVY_GATE_SEVERITY controls which
# severities WITH AN AVAILABLE FIX fail the build (--ignore-unfixed);
# unfixed HIGH/CRITICAL findings are listed in the job summary.
# .trivyignore holds only expiring, approved exceptions — enforced by
# .github/scripts/check-trivyignore.sh (see .github/README.md).
#
# Vulnerability reporting: the trivy SARIF + table reports are always
# uploaded as workflow artifacts. The SARIF is additionally pushed to
# GitHub code scanning only when the repo variable
# CODE_SCANNING_ENABLED == 'true' — code scanning is unavailable on
# private repos without GitHub Advanced Security (see .github/README.md).
#
# Registry flexibility: image Dockerfiles may later FROM secured bases on
# an optional private mirror registry. Set the repo variable
# BASE_MIRROR_REGISTRY plus the BASE_MIRROR_USERNAME /
# BASE_MIRROR_PASSWORD secrets and the login step uses them so base-image
# pulls resolve; when unset the step is a no-op (secrets are scoped to
# that step's env only — see .github/README.md).
#
# Tighten TRIVY_GATE_SEVERITY to UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
# (effectively zero tolerated) once the Wolfi-based runtime bases land.

name: images

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          Platforms to build (comma-separated). Default linux/amd64; set
          "linux/amd64,linux/arm64" to opt into arm64.
        required: false
        default: "linux/amd64"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing is not idempotent per-ref: queue, never cancel mid-push.
  cancel-in-progress: false

env:
  IMAGE_NS: ghcr.io/tinyorbitvn
  TRIVY_GATE_SEVERITY: "CRITICAL,HIGH"
  TRIVY_VERSION: "0.70.0"
  TRIVY_TGZ_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
  SYFT_VERSION: "1.52.0"
  SYFT_TGZ_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
  COSIGN_VERSION: "v3.1.3"
  COSIGN_BIN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  # SUP-3: only the main branch publishes. A workflow_dispatch from another
  # ref builds + scans but pushes nothing.
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  desktop:
    # linux-desktop is the browser image's base — it must be pushed (or its
    # tar uploaded) before the browser leg can consume it.
    name: linux-desktop image (browser base)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # push-by-digest to ghcr
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          # SUPR-10: pin the privileged BuildKit image by digest — the
          # buildx-stable-1 tag is mutable.
          driver-opts: >-
            image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: login to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to base-image mirror (optional — private bases)
        # SEC-05: registry secrets are scoped to this step only — never job
        # env. The mirror is generic: vars.BASE_MIRROR_REGISTRY +
        # BASE_MIRROR_USERNAME/BASE_MIRROR_PASSWORD secrets (.github/README).
        env:
          BASE_MIRROR_REGISTRY: ${{ vars.BASE_MIRROR_REGISTRY }}
          BASE_MIRROR_USERNAME: ${{ secrets.BASE_MIRROR_USERNAME }}
          BASE_MIRROR_PASSWORD: ${{ secrets.BASE_MIRROR_PASSWORD }}
        run: |
          if [ -n "$BASE_MIRROR_REGISTRY" ] && [ -n "$BASE_MIRROR_USERNAME" ] \
            && [ -n "$BASE_MIRROR_PASSWORD" ]; then
            printf '%s' "$BASE_MIRROR_PASSWORD" \
              | docker login "$BASE_MIRROR_REGISTRY" \
                --username "$BASE_MIRROR_USERNAME" --password-stdin
          fi

      - name: compute tags + OCI labels
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          # PUB-2: this image redistributes KasmVNC (GPL-2.0) + noVNC
          # (MPL-2.0) — SPDX headline expression on the licenses label
          # (SBOM + THIRD_PARTY_LICENSES.md carry the full inventory) and
          # a pointer label to the corresponding-source offer shipped on
          # every release (NOTICE has the written offer).
          {
            echo "IMAGE_REF=$IMAGE_NS/tinycdi-linux-desktop"
            echo "OCI_LABELS<<__EOF__"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.licenses=MIT AND GPL-2.0-only AND MPL-2.0"
            echo "io.tinycdi.kasmvnc-source-offer=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NOTICE"
            echo "org.opencontainers.image.title=tinycdi-linux-desktop"
            echo "org.opencontainers.image.description=TinyCDI KasmVNC Linux desktop runtime"
            echo "org.opencontainers.image.version=sha-$SHORT"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: build linux-desktop (digest-only push / dry tar)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: build/linux-desktop/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          outputs: >-
            ${{ env.PUBLISH == 'true'
                && format('type=registry,name={0},push-by-digest=true', env.IMAGE_REF)
                || 'type=docker,dest=/tmp/linux-desktop.tar' }}
          # tags only name the non-publishing docker tar; a push-by-digest
          # build must not carry name:tag refs (buildx rejects tagged refs).
          tags: >-
            ${{ env.PUBLISH != 'true'
                && format('{0}:sha-{1}', env.IMAGE_REF, github.sha) || '' }}
          labels: ${{ env.OCI_LABELS }}
          cache-from: type=gha,scope=linux-desktop
          # cache writes only when publishing — a non-main dispatch must
          # never poison the shared scope the :main build consumes.
          cache-to: >-
            ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=linux-desktop' || '' }}

      - name: record image ref for downstream jobs
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p refs
          if [ "$PUBLISH" = "true" ]; then
            echo "$IMAGE_REF@$BUILD_DIGEST" > refs/linux-desktop.ref
          else
            echo "local" > refs/linux-desktop.ref
          fi

      - name: upload image ref
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-ref-linux-desktop
          path: refs/linux-desktop.ref
          retention-days: 5

      - name: install syft ${{ env.SYFT_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$PWD/bin"
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_TGZ_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C "$PWD/bin" syft

      - name: syft SBOM (SPDX JSON)
        # SUPR-2: the SBOM that promote attests is generated HERE, by the
        # job that built/pushed the image — never by the unprivileged
        # scan job.
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          : > /tmp/syft-empty.yaml   # SUPR-8: never load a repo .syft.yaml
          if [ "$PUBLISH" = "true" ]; then
            SRC="registry:$IMAGE_REF@$BUILD_DIGEST"
          else
            SRC="docker-archive:/tmp/linux-desktop.tar"
          fi
          "$PWD/bin/syft" --config /tmp/syft-empty.yaml \
            "$SRC" -o spdx-json="sbom-linux-desktop.spdx.json"

      - name: upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-linux-desktop
          path: sbom-linux-desktop.spdx.json
          retention-days: 30

      - name: upload image tar (non-publishing runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-tar-linux-desktop
          path: /tmp/linux-desktop.tar
          retention-days: 5
          compression-level: 0  # image layers are already compressed

      - name: docker logout
        if: always() && env.PUBLISH == 'true'
        # SUPR-9: `docker logout` takes ONE registry — one call each, and
        # no `|| true` masking a real failure.
        env:
          BASE_MIRROR_REGISTRY: ${{ vars.BASE_MIRROR_REGISTRY }}
        run: |
          docker logout ghcr.io
          if [ -n "$BASE_MIRROR_REGISTRY" ]; then
            docker logout "$BASE_MIRROR_REGISTRY"
          fi

  build:
    name: ${{ matrix.image }} image
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # push-by-digest to ghcr
    strategy:
      fail-fast: false
      matrix:
        image: [api, operator, gateway, portal, browser]
    env:
      IMG_DESCRIPTION: >-
        ${{ matrix.image == 'api' && 'TinyCDI platform API' ||
            matrix.image == 'operator' && 'TinyCDI Kubernetes operator' ||
            matrix.image == 'gateway' && 'TinyCDI session gateway' ||
            matrix.image == 'portal' && 'TinyCDI web portal' ||
            matrix.image == 'browser' && 'TinyCDI browser workspace (Chromium + Firefox ESR)' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          # SUPR-10: pin the privileged BuildKit image by digest — the
          # buildx-stable-1 tag is mutable.
          driver-opts: >-
            image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: login to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to base-image mirror (optional — private bases)
        # SEC-05: registry secrets are scoped to this step only — never job
        # env. The mirror is generic: vars.BASE_MIRROR_REGISTRY +
        # BASE_MIRROR_USERNAME/BASE_MIRROR_PASSWORD secrets (.github/README).
        env:
          BASE_MIRROR_REGISTRY: ${{ vars.BASE_MIRROR_REGISTRY }}
          BASE_MIRROR_USERNAME: ${{ secrets.BASE_MIRROR_USERNAME }}
          BASE_MIRROR_PASSWORD: ${{ secrets.BASE_MIRROR_PASSWORD }}
        run: |
          if [ -n "$BASE_MIRROR_REGISTRY" ] && [ -n "$BASE_MIRROR_USERNAME" ] \
            && [ -n "$BASE_MIRROR_PASSWORD" ]; then
            printf '%s' "$BASE_MIRROR_PASSWORD" \
              | docker login "$BASE_MIRROR_REGISTRY" \
                --username "$BASE_MIRROR_USERNAME" --password-stdin
          fi

      - name: compute tags + OCI labels
        env:
          IMG: ${{ matrix.image }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          # PUB-2: `browser` redistributes KasmVNC (GPL-2.0), noVNC and
          # Firefox ESR (MPL-2.0) — SPDX headline expression + a pointer to
          # the corresponding-source offer (see NOTICE). Go images: MIT.
          LIC="MIT"
          [ "$IMG" = "browser" ] && LIC="MIT AND GPL-2.0-only AND MPL-2.0"
          {
            echo "IMAGE_REF=$IMAGE_NS/tinycdi-$IMG"
            echo "OCI_LABELS<<__EOF__"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.licenses=$LIC"
            echo "org.opencontainers.image.title=tinycdi-$IMG"
            echo "org.opencontainers.image.description=$IMG_DESCRIPTION"
            echo "org.opencontainers.image.version=sha-$SHORT"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$IMG" = "browser" ]; then
              echo "io.tinycdi.kasmvnc-source-offer=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NOTICE"
            fi
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: browser build wiring (publish — consume desktop digest)
        if: matrix.image == 'browser' && env.PUBLISH == 'true'
        env:
          DESKTOP_DIGEST: ${{ needs.desktop.outputs.digest }}
        run: |
          # The docker-container builder cannot see daemon-local images —
          # FROM the exact linux-desktop manifest the desktop job pushed.
          echo "BUILD_ARGS=BASE_IMAGE=$IMAGE_NS/tinycdi-linux-desktop@$DESKTOP_DIGEST" \
            >> "$GITHUB_ENV"

      - name: download linux-desktop tar (browser leg, non-publishing)
        if: matrix.image == 'browser' && env.PUBLISH != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: image-tar-linux-desktop
          path: /tmp

      - name: build browser (non-publishing — daemon builder)
        if: matrix.image == 'browser' && env.PUBLISH != 'true'
        run: |
          docker load --input /tmp/linux-desktop.tar
          args=(--platform linux/amd64 -f build/browser/Dockerfile
                --build-arg "BASE_IMAGE=$IMAGE_NS/tinycdi-linux-desktop:sha-$GITHUB_SHA")
          while IFS= read -r lbl; do
            args+=(--label "$lbl")
          done <<< "$OCI_LABELS"
          args+=(-t "$IMAGE_REF:sha-$GITHUB_SHA")
          docker build "${args[@]}" .
          docker save "$IMAGE_REF:sha-$GITHUB_SHA" -o /tmp/browser.tar

      - name: build ${{ matrix.image }} (digest-only push / dry tar)
        if: matrix.image != 'browser' || env.PUBLISH == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: build/${{ matrix.image }}/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          outputs: >-
            ${{ env.PUBLISH == 'true'
                && format('type=registry,name={0},push-by-digest=true', env.IMAGE_REF)
                || format('type=docker,dest=/tmp/{0}.tar', matrix.image) }}
          # tags only name the non-publishing docker tar; a push-by-digest
          # build must not carry name:tag refs (buildx rejects tagged refs).
          tags: >-
            ${{ env.PUBLISH != 'true'
                && format('{0}:sha-{1}', env.IMAGE_REF, github.sha) || '' }}
          labels: ${{ env.OCI_LABELS }}
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: >-
            ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      - name: record image ref for downstream jobs
        env:
          IMG: ${{ matrix.image }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p refs
          if [ "$PUBLISH" = "true" ]; then
            echo "$IMAGE_REF@$BUILD_DIGEST" > "refs/$IMG.ref"
          else
            echo "local" > "refs/$IMG.ref"
          fi

      - name: upload image ref
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-ref-${{ matrix.image }}
          path: refs/${{ matrix.image }}.ref
          retention-days: 5

      - name: install syft ${{ env.SYFT_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$PWD/bin"
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_TGZ_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C "$PWD/bin" syft

      - name: syft SBOM (SPDX JSON)
        # SUPR-2: the SBOM that promote attests is generated HERE, by the
        # job that built/pushed the image — never by the unprivileged
        # scan job.
        env:
          IMG: ${{ matrix.image }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          : > /tmp/syft-empty.yaml   # SUPR-8: never load a repo .syft.yaml
          if [ "$PUBLISH" = "true" ]; then
            SRC="registry:$IMAGE_REF@$BUILD_DIGEST"
          else
            SRC="docker-archive:/tmp/$IMG.tar"
          fi
          "$PWD/bin/syft" --config /tmp/syft-empty.yaml \
            "$SRC" -o spdx-json="sbom-$IMG.spdx.json"

      - name: upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30

      - name: upload image tar (non-publishing runs)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-tar-${{ matrix.image }}
          path: /tmp/${{ matrix.image }}.tar
          retention-days: 5
          compression-level: 0  # image layers are already compressed

      - name: docker logout
        if: always() && env.PUBLISH == 'true'
        # SUPR-9: `docker logout` takes ONE registry — one call each, and
        # no `|| true` masking a real failure.
        env:
          BASE_MIRROR_REGISTRY: ${{ vars.BASE_MIRROR_REGISTRY }}
        run: |
          docker logout ghcr.io
          if [ -n "$BASE_MIRROR_REGISTRY" ]; then
            docker logout "$BASE_MIRROR_REGISTRY"
          fi

  scan:
    # SEC-05: scanners run in a job holding only read permissions — no
    # packages: write, no id-token, no attestations, no registry secrets.
    name: scan ${{ matrix.image }}
    needs: [desktop, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read          # pull the pushed digest for scanning
      security-events: write  # trivy SARIF upload to code scanning
      actions: read           # upload-sarif fetches the workflow run
    strategy:
      fail-fast: false
      matrix:
        image: [linux-desktop, api, operator, gateway, portal, browser]
    env:
      IMG: ${{ matrix.image }}
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
    steps:
      - name: download this image's ref
        # SUPF-1: fetch only this leg's artifact by exact name — a merged
        # pattern download could be poisoned by a forged artifact.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: image-ref-${{ matrix.image }}
          path: refs

      - name: resolve scan target
        run: |
          REF="$(cat "refs/$IMG.ref")"
          if [ "$REF" = "local" ]; then
            echo "SCAN_MODE=tar" >> "$GITHUB_ENV"
          else
            echo "SCAN_MODE=registry" >> "$GITHUB_ENV"
            echo "SCAN_REF=$REF" >> "$GITHUB_ENV"
          fi

      - name: download image tar (non-publishing runs)
        if: env.SCAN_MODE == 'tar'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: image-tar-${{ matrix.image }}
          path: /tmp

      - name: login to ghcr.io (read-only pull for scanning)
        if: env.SCAN_MODE == 'registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: install trivy ${{ env.TRIVY_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$PWD/bin"
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_TGZ_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C "$PWD/bin" trivy
          "$PWD/bin/trivy" version

      - name: effective ignorefile + empty tool config
        # SUPR-3: expiry is enforced AT SCAN TIME — the checker revalidates
        # .trivyignore here (empty reason/approver, >30d horizon, malformed
        # IDs all fail) and emits an effective ignorefile that drops expired
        # entries and pins survivors with trivy's native exp:. SUPR-8: the
        # empty --config means a committed trivy.yaml can never neuter the
        # gate (a regression test asserts none exists).
        run: |
          .github/scripts/check-trivyignore.sh \
            --out "$RUNNER_TEMP/trivyignore.effective" .trivyignore
          : > "$RUNNER_TEMP/trivy-empty.yaml"

      - name: trivy scan + gate per platform (${{ env.TRIVY_GATE_SEVERITY }} with fix available)
        # SEC-44: --ignore-unfixed keeps unpatchable findings out of the
        # gate; unfixed HIGH/CRITICALs are listed in the summary below, and
        # every requested platform is scanned (arm64 included when the
        # platforms input opts in). Expiring exceptions live in
        # .trivyignore — enforced at scan time via the effective ignorefile
        # generated above, not by trusting the checked-in file blindly.
        # A failing gate still produces all reports before the job fails.
        run: |
          gate_rc=0
          mkdir -p trivy-sarif
          TCFG=(--config "$RUNNER_TEMP/trivy-empty.yaml"
                --ignorefile "$RUNNER_TEMP/trivyignore.effective")
          if [ "$SCAN_MODE" = "tar" ]; then
            PLAT_LIST=(amd64)
          else
            IFS=',' read -ra PLAT_LIST <<< "$PLATFORMS"
          fi
          for plat in "${PLAT_LIST[@]}"; do
            arch="${plat##*/}"
            if [ "$SCAN_MODE" = "tar" ]; then
              args=(--input "/tmp/$IMG.tar")
            else
              args=(--platform "$plat" "$SCAN_REF")
            fi
            "$PWD/bin/trivy" "${TCFG[@]}" image --scanners vuln \
              --format json -o "trivy-$IMG-$arch.json" "${args[@]}"
            "$PWD/bin/trivy" "${TCFG[@]}" image --scanners vuln \
              --severity "$TRIVY_GATE_SEVERITY" --ignore-unfixed \
              --format table -o "trivy-$IMG-$arch.txt" --exit-code 1 \
              "${args[@]}" || gate_rc=1
            "$PWD/bin/trivy" "${TCFG[@]}" convert --format sarif \
              -o "trivy-sarif/trivy-$IMG-$arch.sarif" "trivy-$IMG-$arch.json"
          done
          exit "$gate_rc"

      - name: unfixed HIGH/CRITICAL summary
        # SUPR-4: report what --ignore-unfixed hides — every unfixed
        # HIGH/CRITICAL finding, listed per image per platform so the real
        # exposure is never invisible behind the gate.
        if: always() && hashFiles(format('trivy-{0}-*.json', matrix.image)) != ''
        run: |
          {
            echo "### trivy — $IMG"
            echo ""
            echo "Gate: \`$TRIVY_GATE_SEVERITY\` severities with a fix available."
            echo ""
            for f in "trivy-$IMG"-*.json; do
              arch="${f##*-}"; arch="${arch%.json}"
              echo "#### platform: $arch"
              echo ""
              echo "| vulnerability | package | severity | installed |"
              echo "|---|---|---|---|"
              jq -r '[.Results[]?.Vulnerabilities[]?
                | select((.Severity == "CRITICAL" or .Severity == "HIGH")
                    and ((.FixedVersion // "") == ""))
                | {id: .VulnerabilityID, pkg: .PkgName,
                   sev: .Severity, ver: .InstalledVersion}]
                | sort_by(.sev, .id)[]
                | "| \(.id) | \(.pkg) | \(.sev) | \(.ver) |"' "$f"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload trivy reports (SARIF + table artifacts)
        if: always() && hashFiles('trivy-sarif/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-${{ matrix.image }}
          path: |
            trivy-sarif/
            trivy-${{ matrix.image }}-*.txt
          retention-days: 30

      - name: upload SARIF to code scanning
        if: >-
          always()
          && env.SCAN_MODE == 'registry'
          && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy-sarif
          category: tinycdi-${{ matrix.image }}

  promote:
    # Signs + attests the gate-passed digests, then promotes them to the
    # :sha-<short> + :main tags (SEC-04/SEC-17; SUPR-13: sign before any
    # tag exists so a signing failure leaves nothing addressable). Runs
    # only for the main branch.
    name: sign + promote tags
    needs: [scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write  # imagetools retag + cosign signatures to ghcr
      id-token: write  # cosign keyless
      actions: read    # gh run download of this run's artifacts (SUPF-1)
    steps:
      # SUPR-10: no setup-buildx here — `docker buildx imagetools` only
      # talks to the registry and needs no privileged BuildKit container.

      # Only the validation scripts are needed; no credentials persisted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: install cosign ${{ env.COSIGN_VERSION }} (pinned installer + sha256)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: verify cosign binary sha256
        run: echo "${COSIGN_BIN_SHA256}  $(command -v cosign)" | sha256sum -c -

      - name: download refs + SBOMs (exact artifact names)
        # SUPF-1: each artifact is fetched by its EXACT name — never a
        # merge-multiple glob, which would let a forged artifact overwrite
        # a same-named file mid-merge.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p refs sboms
          for img in linux-desktop api operator gateway portal browser; do
            gh run download "$GITHUB_RUN_ID" -n "image-ref-$img" -D refs
            gh run download "$GITHUB_RUN_ID" -n "sbom-$img" -D sboms
          done

      - name: validate refs + SBOMs (strict repo@sha256)
        # SUPF-1: refs must be the canonical ghcr repo@sha256:<64hex> form
        # for this repo — anything else fails before signing/promoting.
        run: |
          .github/scripts/validate-image-refs.sh refs \
            linux-desktop api operator gateway portal browser
          for img in linux-desktop api operator gateway portal browser; do
            f="sboms/sbom-$img.spdx.json"
            [ -s "$f" ] || { echo "::error::missing SBOM for '$img'"; exit 1; }
            jq -e . "$f" >/dev/null \
              || { echo "::error::$f is not valid JSON"; exit 1; }
          done

      - name: login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cosign sign images (keyless)
        run: |
          for f in refs/*.ref; do
            ref="$(tr -d '[:space:]' < "$f")"
            cosign sign --yes "$ref"
          done

      - name: cosign attest image SBOMs
        # SEC-17: :main channel images carry their SBOM as a cosign
        # attestation on the digest.
        run: |
          for f in refs/*.ref; do
            name="$(basename "$f" .ref)"
            ref="$(tr -d '[:space:]' < "$f")"
            cosign attest --yes --type spdxjson \
              --predicate "sboms/sbom-$name.spdx.json" "$ref"
          done

      - name: promote tags (:sha-<short> + :main)
        # SUPR-13: last step — the digests are already signed + attested.
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          for f in refs/*.ref; do
            ref="$(tr -d '[:space:]' < "$f")"
            base="${ref%@*}"
            docker buildx imagetools create \
              -t "$base:sha-$SHORT" -t "$base:main" "$ref"
          done

      - name: docker logout
        if: always()
        # SUPR-9: one logout call per registry; failures are not masked.
        run: docker logout ghcr.io
