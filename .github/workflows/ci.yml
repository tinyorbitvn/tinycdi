---
# ci.yml — pull_request + push-to-main continuous integration.
#
# Every action is pinned by full commit SHA (version in the trailing
# comment) and every downloaded tool by exact version + sha256, matching
# deploy/compatibility.lock.yaml where a lock exists.
#
# Toolchain pins:
#   Go 1.26.8              — go.mod `toolchain go1.26.8`
#   Node 22.23.3           — docs/compatibility.md (npm bundled with node)
#   setup-envtest v0.25.1  — sigs.k8s.io/controller-runtime from go.mod
#   envtest k8s 1.37.0     — k8s.io/api v0.37.1 in go.mod
#   Helm v4.1.3            — get.helm.sh tarball, sha256-verified below
#   actionlint 1.7.9       — rhysd/actionlint release tarball, sha256-verified
#   govulncheck v1.8.0     — go install, module-sumdb verified
#   yamllint 1.38.0        — PyPI wheel, sha256-verified (pip --require-hashes)
#   zizmor 1.30.1          — PyPI wheel, sha256-verified (pip --require-hashes)
#   Postgres 18.0          — pinned digest; same image the integration suite
#                            self-provisions (tests/integration/pg_helpers_test.go)
#
# The weekly schedule re-runs the dependency scans (govulncheck, npm audit)
# so newly disclosed CVEs in pinned dependencies fail CI without a commit.

name: ci

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1"  # weekly dependency rescan (SEC-19)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale runs on PR updates; let main pushes run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub's default run shell is `bash -e` — no pipefail — so a failing
# command piped into tee/grep exits 0 and silently masks a gate failure
# (KASM-4: `go test | tee` in kasm-contract). `shell: bash` selects
# `bash --noprofile --norc -eo pipefail` for every run step.
defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "22.23.3"
  ENVTEST_VERSION: "v0.25.1"
  ENVTEST_K8S_VERSION: "1.37.0"
  HELM_VERSION: "v4.1.3"
  HELM_TGZ_SHA256: "02ce9722d541238f81459938b84cf47df2fdf1187493b4bfb2346754d82a4700"
  ACTIONLINT_VERSION: "1.7.9"
  ACTIONLINT_BIN_SHA256: "32d25dc9ab0f6f8fcc085ebedd0a0e45187cf8976422534a41944335b97a117f"

jobs:
  go:
    name: go vet + test -race (envtest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt clean
        run: test -z "$(gofmt -l api cmd internal build deploy/helm | tee /dev/stderr)"
      - name: go vet
        run: go vet ./api/... ./cmd/... ./internal/... ./build/... ./deploy/helm
      - name: setup-envtest (pinned)
        run: |
          GOBIN="$PWD/bin" go install \
            sigs.k8s.io/controller-runtime/tools/setup-envtest@${{ env.ENVTEST_VERSION }}
          ./bin/setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin"
      - name: go test -race
        run: |
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use \
            ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin" -p path)" \
            go test -race -count=1 ./api/... ./cmd/... ./internal/... ./build/...

  integration:
    name: integration (postgres service + envtest)
    runs-on: ubuntu-24.04
    services:
      # Pinned to the same digest the suite self-provisions via docker
      # (tests/integration/pg_helpers_test.go pgImage). The service pre-warms
      # the exact image on the daemon and provides a shared instance for any
      # step needing a fixed DSN; the suite's own containers are the ones the
      # assertions run against.
      postgres:
        image: >-
          docker.io/library/postgres:18.0@sha256:41fc5342eefba6cc2ccda736aaf034bbbb7c3df0fdb81516eba1ba33f360162c
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: setup-envtest (pinned)
        run: |
          GOBIN="$PWD/bin" go install \
            sigs.k8s.io/controller-runtime/tools/setup-envtest@${{ env.ENVTEST_VERSION }}
          ./bin/setup-envtest use ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin"
      - name: go test -tags=integration (cluster-free set)
        run: |
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use \
            ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin" -p path)" \
            go test -tags=integration -race -count=1 \
            -skip '^TestLinuxRuntime(ReadinessAndHome|FirefoxFallback)$|^TestKasmAdapter' \
            ./tests/integration/...
          # -skip: TestLinuxRuntimeReadinessAndHome, TestLinuxRuntimeFirefoxFallback
          # and TestKasmAdapter* need
          # the built runtime/adapter images (tcdi/linux-desktop:it,
          # tcdi/browser:it, a pulled kasmweb/* image) — image-bound suites,
          # not routine CI. Everything else runs on envtest + the suite's
          # own docker-provisioned postgres.
      - name: restart-drill evidence (verbose)
        # The G1 gate criterion (D23) is the two-replica restart drill; keep a
        # verbose re-run in the log so reviewers can see each test ran and
        # passed rather than trust the package-level "ok" line.
        run: |
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use \
            ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin" -p path)" \
            go test -tags=integration -race -count=1 -v \
            -run '^TestRestart_' ./tests/integration/...
          KUBEBUILDER_ASSETS="$(./bin/setup-envtest use \
            ${{ env.ENVTEST_K8S_VERSION }} --bin-dir "$PWD/bin" -p path)" \
            go test -count=1 -v \
            -run '^(TestRun_DrainsOnShutdown|TestGatewayIDSharedAcrossInstances)$' \
            ./internal/backend/

  web:
    name: portal ui (npm ci, tsc, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The portal e2e suite (web/tests-portal) builds and runs the real Go
      # binaries itself — ./build/frontend (SPA server) and ./cmd/backend in
      # split mode (-broker-url, session listener only) — in Playwright
      # setup, so the job only needs Go here plus `npm run test:e2e` below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: npm ci
      - name: npm audit (prod deps, high+)
        # SEC-19: production dependency advisories fail CI; dev-only
        # findings are out of the shipping artifact's trust boundary.
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck      # tsc --noEmit
      - run: npm run test:unit      # vitest run
      - run: npm run build          # tsc --noEmit && vite build
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e       # playwright: vite suite + frontend/backend e2e

  soak:
    name: soak harness (npm ci, tsc, unit + dry-run)
    # tests/soak is the v0.2 soak/drill harness (acceptance criterion 9):
    # `npm test` runs its unit tests and the dry-run end-to-end check
    # against the contract mock — no cluster and no browser needed.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/soak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/soak/package-lock.json
      - run: npm ci
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck      # tsc --noEmit
      - run: npm test               # node --test: unit tests + dry-run

  helm:
    name: chart (helm lint --strict + chart tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install helm ${{ env.HELM_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$PWD/bin"
          curl -fsSL -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz"
          echo "${{ env.HELM_TGZ_SHA256 }}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C "$PWD/bin" --strip-components=1 linux-amd64/helm
          "$PWD/bin/helm" version
      - name: helm lint --strict
        run: |
          "$PWD/bin/helm" lint --strict deploy/helm/tinycdi
          # Per-fixture lint across the chart's ci/ values matrix, when the
          # chart ships one (mirrors deploy/helm/chart_test.go).
          if [ -d deploy/helm/tinycdi/ci ]; then
            for f in deploy/helm/tinycdi/ci/*.yaml; do
              echo "== helm lint --strict -f $f"
              "$PWD/bin/helm" lint --strict deploy/helm/tinycdi -f "$f"
            done
          fi
      - name: chart tests
        env:
          TCDI_HELM: ${{ github.workspace }}/bin/helm
        run: go test -count=1 ./deploy/helm/

  govulncheck:
    name: govulncheck (Go vuln scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install govulncheck v1.8.0 (module-sumdb verified)
        run: |
          GOBIN="$PWD/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck (fails on reachable vulns)
        run: ./bin/govulncheck ./...

  dependency-review:
    name: dependency review (PRs)
    # Dependency review needs GitHub Advanced Security on private repos —
    # gated on the same repo variable as code scanning (see .github/README.md).
    if: github.event_name == 'pull_request' && vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  workflow-policy:
    name: workflow policy tests (.github)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: regression tests
        run: |
          for t in .github/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
      - name: .trivyignore expiry policy
        run: .github/scripts/check-trivyignore.sh
      - name: kasm catalog policy (KASM-2/KASM-5)
        # Every kasmweb/* ref in ci values/docs must be a digest-pinned
        # catalog entry whose engine floor meets the documented minimum;
        # the catalog's own trivyignore follows the same expiry policy.
        run: |
          .github/scripts/check-kasm-catalog.sh
          .github/scripts/check-trivyignore.sh build/kasm-catalog.trivyignore

  kasm-contract:
    # KASM-4/KASM-5: the docker-emulated pod contract test plus the
    # heavyweight catalog scan (trivy gate + browser-engine freshness).
    # ~2 GB image pull and ~10 min runtime — too heavy for every PR, so it
    # runs weekly, on workflow_dispatch, on main pushes, and on PRs that
    # touch the adapter/catalog surface (the gate step skips the rest in
    # ~15 s on unrelated PRs). The always-on unit-level guard is the
    # kasm-catalog check in workflow-policy.
    name: kasm adapter contract + catalog scan
    runs-on: ubuntu-24.04
    env:
      TRIVY_VERSION: "0.70.0"
      TRIVY_TGZ_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gate on kasm-relevant changes
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch|push) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git fetch -q origin "$BASE_REF"
          # One line on purpose: a backslash-continued string keeps the next
          # line's indentation, which splits the word and runs the rest as a command.
          PATHS_RE='^(build/kasm-adapter/|build/kasm-catalog|\.github/scripts/(check|scan)-kasm-catalog\.sh|\.github/tests/kasm-catalog\.test\.sh|tests/integration/kasm_adapter_test\.go|internal/runtime/linux/|deploy/helm/tinycdi/ci/example-values\.yaml|docs/kasm-images\.md|\.github/workflows/ci\.yml)'
          # grep -q short-circuits on the first match and can SIGPIPE the
          # producer on a large diff — under pipefail that would flip the
          # gate to "skip". A herestring feeds grep without a pipeline,
          # so a failing git diff still aborts the step.
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -qE "$PATHS_RE" <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build adapter image (tcdi/kasm-adapter:it)
        if: steps.gate.outputs.run == 'true'
        run: docker build -f build/kasm-adapter/Dockerfile -t tcdi/kasm-adapter:it .
      - name: install trivy ${{ env.TRIVY_VERSION }} (sha256-verified)
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${{ env.TRIVY_TGZ_SHA256 }}  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p "$PWD/bin"
          tar -xzf /tmp/trivy.tgz -C "$PWD/bin" trivy
          "$PWD/bin/trivy" version
      - name: catalog scan (trivy gate + engine freshness floor)
        if: steps.gate.outputs.run == 'true'
        run: PATH="$PWD/bin:$PATH" .github/scripts/scan-kasm-catalog.sh
      - name: adapter contract test (per cataloged image)
        if: steps.gate.outputs.run == 'true'
        run: |
          while read -r ref _; do
            case "$ref" in ''|\#*) continue;; esac
            out="$(mktemp)"
            TCDI_IT_KASM_IMAGE="$ref" \
              go test -tags=integration -count=1 -timeout 20m -v \
              ./tests/integration -run TestKasmAdapterChromium | tee "$out"
            # A SKIP here is silent gate loss — the disk-floor and env
            # guards inside the test must never skip it in CI.
            if grep -q -- '--- SKIP: TestKasmAdapterChromium' "$out"; then
              echo "::error::contract test skipped for $ref — gate lost"
              exit 1
            fi
          done < build/kasm-catalog.txt

  quickstart:
    # V3.11/E10: hack/quickstart/up.sh brings up kind + Traefik + Postgres +
    # dev Keycloak + the chart from this tree; a Playwright smoke logs in,
    # creates a browser workspace and waits for the session frame; down.sh
    # must leave no kind cluster. Images are built from the working tree and
    # `kind load`ed (a published tag may lag the chart), and the runtime
    # images come from the published runtime train by digest, pre-pulled in
    # parallel with the build, so up.sh stays well inside 20 minutes.
    # Runs on main pushes, workflow_dispatch and PRs touching
    # hack/quickstart/, deploy/helm/ or build/; every other PR skips it in
    # ~15 s. Not a required check.
    name: quickstart (kind up.sh + portal smoke)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_VERSION: "0.33.0"
      KIND_BIN_SHA256: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
      TCDI_QS_CLUSTER: tcdi-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gate on quickstart-relevant changes
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|push) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git fetch -q origin "$BASE_REF"
          PATHS_RE='^(hack/quickstart/|deploy/helm/|build/)'
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -qE "$PATHS_RE" <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hack/quickstart/smoke/package-lock.json
      - name: shellcheck quickstart scripts
        if: steps.gate.outputs.run == 'true'
        run: shellcheck -x hack/quickstart/up.sh hack/quickstart/down.sh hack/quickstart/common.sh
      - name: install helm ${{ env.HELM_VERSION }} (sha256-verified)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz"
          echo "${{ env.HELM_TGZ_SHA256 }}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C "$HOME/.local/bin" --strip-components=1 linux-amd64/helm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install kind v${{ env.KIND_VERSION }} (sha256-verified)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${{ env.KIND_VERSION }}/kind-linux-amd64"
          echo "${{ env.KIND_BIN_SHA256 }}  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          "$HOME/.local/bin/kind" version
      - name: up.sh (budget 20 min)
        if: steps.gate.outputs.run == 'true'
        run: |
          start="$(date +%s)"
          timeout --signal=TERM 1200 hack/quickstart/up.sh
          echo "up.sh took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: install playwright chromium
        if: steps.gate.outputs.run == 'true'
        working-directory: hack/quickstart/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: portal smoke (session frame; retained-disk attach round trip)
        if: steps.gate.outputs.run == 'true'
        working-directory: hack/quickstart/smoke
        # kubectl inside the smoke writes/reads a file in the workspace home.
        run: |
          export KUBECONFIG="$HOME/.local/state/tcdi-quickstart/${TCDI_QS_CLUSTER}/kubeconfig"
          npx playwright test
      - name: diagnostics
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          export KUBECONFIG="$HOME/.local/state/tcdi-quickstart/${TCDI_QS_CLUSTER}/kubeconfig"
          kubectl get pods -A -o wide || true
          kubectl get workspaces,workspacetemplates -A || true
          kubectl -n tinycdi-system logs deploy/backend --tail=100 || true
          kubectl -n tinycdi-system logs deploy/operator --tail=100 || true
          kubectl -n tcdi-qs-deps logs deploy/keycloak --tail=60 || true
      - name: upload smoke report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: quickstart-smoke
          path: hack/quickstart/smoke/test-results
          if-no-files-found: ignore
      - name: down.sh leaves no kind cluster
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          hack/quickstart/down.sh
          hack/quickstart/down.sh   # idempotent: a second run is a no-op
          if kind get clusters 2>/dev/null | grep -q .; then
            echo "::error::kind clusters left behind:"
            kind get clusters
            exit 1
          fi

  actionlint:
    name: workflow lint (actionlint + yamllint + zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install yamllint + zizmor (hash-pinned wheels)
        # SUPR-7: pathspec 0.12.1 conflicts with yamllint 1.38.0's
        # pathspec>=1.0.0 requirement — pin the compatible release.
        run: |
          cat > /tmp/ci-tools.txt <<'EOF'
          yamllint==1.38.0 --hash=sha256:fc394a5b3be980a4062607b8fdddc0843f4fa394152b6da21722f5d59013c220
          pathspec==1.1.1 --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          PyYAML==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476
          zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
          EOF
          pip install --require-hashes --only-binary :all: -r /tmp/ci-tools.txt
      - name: install actionlint ${{ env.ACTIONLINT_VERSION }} (sha256-verified)
        run: |
          mkdir -p "$PWD/bin"
          V="${{ env.ACTIONLINT_VERSION }}"
          URL="https://github.com/rhysd/actionlint/releases/download/v${V}/actionlint_${V}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz "$URL"
          tar -xzf /tmp/actionlint.tgz -C "$PWD/bin" actionlint
          echo "${{ env.ACTIONLINT_BIN_SHA256 }}  $PWD/bin/actionlint" | sha256sum -c -
      - name: actionlint
        run: |
          "$PWD/bin/actionlint" -color .github/workflows/*.yml
      - name: yamllint
        run: yamllint -c .github/.yamllint.yml .github/workflows/
      - name: zizmor
        run: zizmor .github/workflows/
