---
# Dependabot — keeps the supply-chain pins fresh (SEC-19).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript (7.13.x) still peers typescript ^5 and needs the
      # classic compiler API; drop this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories:
      - "/build/*/"
    schedule:
      interval: weekly
